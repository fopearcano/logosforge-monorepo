name: Release — LogosForge Pro (Native desktop)

# Coordinated native release for LogosForge Pro. The historical filename is
# retained so existing repository links keep working. Manual runs are build-only
# by default: Windows and Linux are selected, while macOS is opt-in on the
# self-hosted Intel macOS 12+ host. The Monterey job contains no JavaScript
# actions: it transfers its verified candidate to a private, digest-addressed
# GHCR handoff. A hosted Ubuntu job verifies that handoff and creates the normal
# Actions artifacts. A v* tag selects all three platforms. One final hosted job
# owns GitHub Release mutation, avoiding platform races.
# All current artifacts are unsigned.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows x64 (NSIS + portable)"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux x64 (AppImage, Ubuntu 22.04 baseline)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS 12+ Intel x64 and verify its hosted handoff"
        type: boolean
        default: false
      publish_release:
        description: "Publish selected artifacts to the verified Pro prerelease"
        type: boolean
        default: false
      release_tag:
        description: "Existing Pro tag to publish (must equal v<package version>)"
        type: string
        required: false
        default: "v0.1.4"

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve immutable release source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      build_windows: ${{ steps.release.outputs.build_windows }}
      build_linux: ${{ steps.release.outputs.build_linux }}
      build_macos: ${{ steps.release.outputs.build_macos }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      notes_path: ${{ steps.release.outputs.notes_path }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout monorepo without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: "22"

      - name: Resolve and verify Pro release metadata
        id: release
        env:
          MANUAL_BUILD_WINDOWS: ${{ inputs.build_windows }}
          MANUAL_BUILD_LINUX: ${{ inputs.build_linux }}
          MANUAL_BUILD_MACOS: ${{ inputs.build_macos }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          publish=false
          release_tag=""
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                echo "::error::Release push is not a tag."
                exit 1
              fi
              build_windows=true
              build_linux=true
              build_macos=true
              publish=true
              release_tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              build_windows="${MANUAL_BUILD_WINDOWS:-true}"
              build_linux="${MANUAL_BUILD_LINUX:-true}"
              build_macos="${MANUAL_BUILD_MACOS:-false}"
              if [ "${MANUAL_PUBLISH:-false}" = "true" ]; then
                publish=true
                release_tag="${MANUAL_TAG:-}"
              fi
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          for selection in "$build_windows" "$build_linux" "$build_macos"; do
            case "$selection" in
              true|false) ;;
              *) echo "::error::Invalid platform selection: $selection"; exit 1 ;;
            esac
          done
          if [ "$build_windows" != "true" ] && [ "$build_linux" != "true" ] && [ "$build_macos" != "true" ]; then
            echo "::error::Select at least one native platform."
            exit 1
          fi

          if [ "$publish" = "true" ]; then
            if [ -z "$release_tag" ]; then
              echo "::error::A release tag is required when publishing."
              exit 1
            fi
            case "$release_tag" in
              v*) ;;
              *) echo "::error::A Pro release tag must start with v."; exit 1 ;;
            esac
            if ! git check-ref-format "refs/tags/$release_tag" >/dev/null; then
              echo "::error::Invalid release tag: $release_tag"
              exit 1
            fi
            tag_commit="$(git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}")" || {
              echo "::error::Release tag does not exist: $release_tag"
              exit 1
            }
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              git checkout --detach --quiet "$tag_commit"
            fi
            if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
              echo "::error::The checked-out source does not match $release_tag."
              exit 1
            fi
          fi

          # shellcheck disable=SC2016
          version="$(
            node -e '
              const fs = require("node:fs");
              const roots = [
                ["desktop", "pro-desktop/package.json", "pro-desktop/package-lock.json", "@logosforge/pro-desktop"],
                ["sharedUi", "pro-shared-ui/package.json", "pro-shared-ui/package-lock.json", "@logosforge/pro-shared-ui"],
                ["contracts", "logosforge-ui-contracts/package.json", "logosforge-ui-contracts/package-lock.json", "@logosforge/ui-contracts"],
              ];
              let desktopVersion = "";
              const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
              for (const [label, packagePath, lockPath, expectedName] of roots) {
                const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
                const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
                if (pkg.name !== expectedName || lock.name !== expectedName || lock.packages?.[""]?.name !== expectedName) {
                  console.error(`::error::Unexpected ${label} package identity.`);
                  process.exit(1);
                }
                const versions = [pkg.version, lock.version, lock.packages?.[""]?.version];
                if (versions.some((value) => typeof value !== "string") || new Set(versions).size !== 1 || !semver.test(pkg.version)) {
                  console.error(`::error::Invalid or inconsistent ${label} versions: ${JSON.stringify(versions)}`);
                  process.exit(1);
                }
                if (label === "desktop") desktopVersion = pkg.version;
              }
              process.stdout.write(desktopVersion);
            '
          )"

          expected_tag="v${version}"
          notes_path="pro-desktop/release-notes/${expected_tag}.md"
          if [ "$publish" = "true" ] && [ "$release_tag" != "$expected_tag" ]; then
            echo "::error::Tag $release_tag does not match Pro package version $version; expected $expected_tag."
            exit 1
          fi
          if [ "$publish" = "true" ] && [ ! -s "$notes_path" ]; then
            echo "::error::Missing or empty versioned Pro release notes: $notes_path"
            echo "::error::Build-only runs remain available until release-note infrastructure is added."
            exit 1
          fi
          if [ "$publish" != "true" ]; then
            release_tag="$expected_tag"
          fi

          {
            echo "build_windows=$build_windows"
            echo "build_linux=$build_linux"
            echo "build_macos=$build_macos"
            echo "publish=$publish"
            echo "version=$version"
            echo "tag=$release_tag"
            echo "notes_path=$notes_path"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Complete core release gate
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout verified source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release-gate source
        run: test "$(git rev-parse HEAD)" = "${{ needs.metadata.outputs.source_sha }}"

      - name: Install Linux test runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libportaudio2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            logosforge/pyproject.toml
            logosforge/requirements.txt

      - name: Install complete core and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r logosforge/requirements.txt "./logosforge[mcp]" httpx pytest
          python -m pip check

      - name: Verify MCP stdio test dependency
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from mcp.client.stdio import stdio_client
          from mcp.server import Server

          assert stdio_client is not None
          assert Server is not None
          print(f"MCP SDK {version('mcp')} is available for the real stdio test")
          PY

      - name: Run complete core suite
        working-directory: logosforge
        run: python tools/run_pytest_modules.py

  build_windows:
    name: Windows x64 — test, freeze, smoke, package
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout verified source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and monorepo layout
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Windows" && test "$RUNNER_ARCH" = "X64"
          test "$(git rev-parse HEAD)" = "${{ needs.metadata.outputs.source_sha }}"
          for path in logosforge/pyproject.toml logosforge-ui-contracts/package.json pro-shared-ui/package.json pro-desktop/package.json pro-desktop/core/logosforge-core.spec pro-desktop/core/logosforge-mcp.spec pro-desktop/scripts/live-context-core-manager-driver.cjs pro-desktop/scripts/packaged-workspace-acceptance.mjs pro-desktop/scripts/smoke-live-context-bridge.py; do
            test -e "$path" || { echo "::error::Missing required monorepo path: $path"; exit 1; }
          done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            logosforge-ui-contracts/package-lock.json
            pro-shared-ui/package-lock.json
            pro-desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"

      - name: Build a fresh voice-capable frozen core
        run: |
          set -euo pipefail
          rm -rf -- pro-desktop/core/build pro-desktop/core/dist build-venv
          python -m venv build-venv
          ./build-venv/Scripts/python.exe -m pip install --upgrade pip
          ./build-venv/Scripts/python.exe -m pip install "./logosforge[export,voice,mcp]" httpx "pyinstaller==6.22.2"
          ./build-venv/Scripts/python.exe -m pip check
          ./build-venv/Scripts/python.exe -c "import ctranslate2, faster_whisper, sounddevice; print('voice imports OK', ctranslate2.__version__)"
          ./build-venv/Scripts/python.exe -m compileall -q logosforge/logosforge pro-desktop/core pro-desktop/scripts/smoke-live-context-bridge.py
          node --check pro-desktop/scripts/live-context-core-manager-driver.cjs
          ./build-venv/Scripts/python.exe - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from logosforge.api import ApiConfig, create_api
          from logosforge.db import Database
          os.environ["LOGOSFORGE_VOICE_MODEL"] = os.path.abspath("missing-release-smoke-model")
          with TestClient(create_api(db=Database(), config=ApiConfig(mode="desktop"))) as client:
              health = client.get("/api/health").json()
              assert health["status"] == "ok" and health["service"] == "logosforge-api"
              voice = client.get("/api/voice/status").json()
              assert voice["model_configured"] is True and voice["available"] is False
              assert "Install 'faster-whisper'" not in voice["message"]
          print("source API and faster-whisper status smoke OK")
          PY
          cd pro-desktop/core
          ../../build-venv/Scripts/python.exe -m PyInstaller logosforge-core.spec --noconfirm --clean --log-level WARN
          ../../build-venv/Scripts/python.exe -m PyInstaller logosforge-mcp.spec --noconfirm --clean --log-level WARN
          ../../build-venv/Scripts/python.exe - <<'PY'
          from pathlib import Path
          binary = Path("dist/logosforge-core/logosforge-core.exe")
          def pe_machine(path):
              with path.open("rb") as handle:
                  dos = handle.read(64)
                  if len(dos) != 64 or dos[:2] != b"MZ": return None
                  handle.seek(int.from_bytes(dos[60:64], "little"))
                  return handle.read(4), int.from_bytes(handle.read(2), "little")
          if not binary.is_file() or pe_machine(binary) != (b"PE\0\0", 0x8664):
              raise SystemExit("::error::Frozen core is not a native Windows x64 PE executable.")
          companion = Path("dist/logosforge-mcp.exe")
          if not companion.is_file() or pe_machine(companion) != (b"PE\0\0", 0x8664):
              raise SystemExit("::error::Frozen MCP companion is not a native Windows x64 PE executable.")
          print(f"native Windows x64 frozen core + MCP OK: {binary}, {companion}")
          PY
          portaudio_files="$(find dist/logosforge-core -type f -iname '*portaudio*' -print)"
          [ -n "$portaudio_files" ] || {
            echo "::error::PyInstaller omitted the PortAudio runtime required by the declared voice extra."
            exit 1
          }

      - name: Smoke-test frozen core identity and voice import
        run: |
          set -euo pipefail
          CORE_EXE="$PWD/pro-desktop/core/dist/logosforge-core/logosforge-core.exe" \
          EXPECTED_CORE_VERSION="$(./build-venv/Scripts/python.exe -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/Scripts/python.exe -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/Scripts/python.exe - <<'PY'
          import json, os, shutil, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-core-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "core.log"
          nonce, token = "release-smoke-nonce", "release-smoke-token"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy()
          env.update({"API_AUTH_TOKEN": token, "API_INSTANCE_NONCE": nonce,
                      "LOGOSFORGE_VOICE_MODEL": str(work / "deliberately-missing-model"),
                      "LOGOSFORGE_VOICE_DEVICE": "cpu", "LOGOSFORGE_VOICE_COMPUTE": "int8"})
          command = [os.environ["CORE_EXE"], "--host", "127.0.0.1", "--port", str(port),
                     "--mode", "desktop", "--db", str(work / "logosforge.db")]
          proc = None; failure = None
          def get(path, auth=False, timeout=2):
              headers = {"Authorization": f"Bearer {token}"} if auth else {}
              with urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}{path}", headers=headers), timeout=timeout) as response:
                  return json.load(response)
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen(command, cwd=Path(os.environ["CORE_EXE"]).parent, env=env,
                                          stdout=log, stderr=subprocess.STDOUT,
                                          creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
                  health = None
                  for attempt in range(45):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try: health = get("/api/health")
                      except Exception: continue
                      if health.get("status") == "ok": print(f"frozen core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"frozen core did not become healthy (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"], "instance_nonce": nonce}
                  if any(health.get(k) != v for k, v in expected.items()): raise RuntimeError(f"identity mismatch: {health!r}")
                  voice = get("/api/voice/status", True, timeout=30)
                  if voice.get("model_configured") is not True or voice.get("available") is not False: raise RuntimeError(f"voice status: {voice!r}")
                  if "Install 'faster-whisper'" in str(voice.get("message", "")): raise RuntimeError(f"faster-whisper omitted: {voice!r}")
                  print("frozen faster-whisper import path OK (model intentionally absent)")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  subprocess.run(["taskkill.exe", "/PID", str(proc.pid), "/T", "/F"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired: failure = failure or RuntimeError(f"PID {proc.pid} survived teardown")
              for _ in range(20):
                  try: get("/api/health")
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- frozen core log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY

      - name: Smoke-test frozen MCP descriptor and authenticated read
        run: >-
          ./build-venv/Scripts/python.exe pro-desktop/scripts/smoke-frozen-mcp.py
          pro-desktop/core/dist/logosforge-core/logosforge-core.exe
          --mcp-executable pro-desktop/core/dist/logosforge-mcp.exe

      - name: Test contracts and Pro sources
        run: |
          set -euo pipefail
          cd logosforge-ui-contracts && npm ci && npm test && node ../.github/npm-audit-policy.mjs
          cd ../pro-shared-ui && npm ci && npm test && npm run build && node ../.github/npm-audit-policy.mjs
          cd ../pro-desktop && npm ci && npm test && node ../.github/npm-audit-policy.mjs

      - name: Exercise real CoreManager live context through connector and MCP
        run: >-
          ./build-venv/Scripts/python.exe pro-desktop/scripts/smoke-live-context-bridge.py
          --core pro-desktop/core/dist/logosforge-core/logosforge-core.exe
          --mcp pro-desktop/core/dist/logosforge-mcp.exe

      - name: Package Windows installer and portable app
        working-directory: pro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          rm -rf -- release
          npm run dist:win

      - name: Inspect and launch-smoke packaged Windows app
        run: |
          set -euo pipefail
          installer="pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64.exe"
          portable="pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64-portable.exe"
          set -- pro-desktop/release/*.exe
          if [ "$#" -ne 2 ] || [ ! -s "$installer" ] || [ ! -s "$portable" ]; then
            echo "::error::Expected exactly the versioned Windows NSIS and portable executables."
            exit 1
          fi
          test -s "pro-desktop/release/win-unpacked/resources/app.asar"
          test -f "pro-desktop/release/win-unpacked/resources/core/logosforge-core.exe"
          test -f "pro-desktop/release/win-unpacked/resources/mcp/logosforge-mcp.exe"
          portaudio_files="$(find pro-desktop/release/win-unpacked/resources/core -type f -iname '*portaudio*' -print)"
          test -n "$portaudio_files"
          APP_EXE="$PWD/pro-desktop/release/win-unpacked/LogosForge Pro.exe" \
          EXPECTED_CORE_VERSION="$(./build-venv/Scripts/python.exe -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/Scripts/python.exe -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/Scripts/python.exe - <<'PY'
          import json, os, shutil, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          app = Path(os.environ["APP_EXE"]); core = app.parent / "resources/core/logosforge-core.exe"
          def pe_machine(path):
              with path.open("rb") as handle:
                  dos = handle.read(64)
                  if len(dos) != 64 or dos[:2] != b"MZ": return None
                  handle.seek(int.from_bytes(dos[60:64], "little"))
                  return handle.read(4), int.from_bytes(handle.read(2), "little")
          if not app.is_file() or pe_machine(app) != (b"PE\0\0", 0x8664): raise SystemExit("::error::Packaged app is not Windows x64.")
          if not core.is_file() or pe_machine(core) != (b"PE\0\0", 0x8664): raise SystemExit("::error::Packaged core is not Windows x64.")
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-app-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "app.log"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy(); env.update({"HOME": str(work), "USERPROFILE": str(work), "LOGOSFORGE_PORT": str(port),
                                               "LOGOSFORGE_VOICE_MODEL": "", "ELECTRON_ENABLE_LOGGING": "1"})
          proc = None; failure = None
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen([str(app), "--disable-gpu", f"--user-data-dir={work / 'electron-user-data'}"],
                                          env=env, stdout=log, stderr=subprocess.STDOUT,
                                          creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
                  health = None
                  for attempt in range(60):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try:
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=2) as response: health = json.load(response)
                      except Exception: continue
                      if health.get("status") == "ok": print(f"packaged app core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"packaged app did not start core (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"]}
                  if any(health.get(k) != v for k, v in expected.items()) or not health.get("instance_nonce"): raise RuntimeError(f"identity mismatch: {health!r}")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  subprocess.run(["taskkill.exe", "/PID", str(proc.pid), "/T", "/F"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired: failure = failure or RuntimeError(f"PID {proc.pid} survived teardown")
              for _ in range(20):
                  try: urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=.25).close()
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- packaged app log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY
          ./build-venv/Scripts/python.exe - <<'PY'
          from pathlib import Path
          artifacts = sorted(Path("pro-desktop/release").glob("*.exe"))
          if len(artifacts) != 2 or any(p.stat().st_size == 0 or p.read_bytes()[:2] != b"MZ" for p in artifacts):
              raise SystemExit("::error::Expected native NSIS and portable executables.")
          print("Windows artifacts:", ", ".join(p.name for p in artifacts))
          PY

      - name: Exercise packaged Windows MCP companion
        run: >-
          ./build-venv/Scripts/python.exe pro-desktop/scripts/smoke-packaged-mcp.py
          "pro-desktop/release/win-unpacked/LogosForge Pro.exe"

      - name: Exercise packaged Pro pointer workspace and restart persistence
        working-directory: pro-desktop
        env:
          LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_ROOT: ${{ runner.temp }}/logosforge-pro-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:packaged-workspace

      - name: Upload packaged workspace diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-windows-workspace-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logosforge-pro-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Exercise portable Windows MCP companion
        run: >-
          ./build-venv/Scripts/python.exe pro-desktop/scripts/smoke-packaged-mcp.py
          "pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64-portable.exe"

      - name: Record Windows dependency and artifact provenance
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/logosforge-pro-windows-x64-provenance"
          mkdir -p "$provenance"
          ./build-venv/Scripts/python.exe -m pip freeze --all > "$provenance/pip-freeze.txt"
          {
            echo "source_sha=${{ needs.metadata.outputs.source_sha }}"
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "platform=windows-x64"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "python=$(./build-venv/Scripts/python.exe --version 2>&1)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "source_tree_manifest_sha256=$(git ls-tree -r --full-tree '${{ needs.metadata.outputs.source_sha }}' | sha256sum | awk '{print $1}')"
            sha256sum pro-desktop/release/*.exe
          } > "$provenance/SHA256SUMS-and-build.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-windows-x64
          path: pro-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-windows-x64-provenance
          path: ${{ runner.temp }}/logosforge-pro-windows-x64-provenance/*
          if-no-files-found: error
          retention-days: 30

  build_linux:
    name: Linux x64 — test, freeze, smoke, AppImage
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_linux == 'true'
    # PyInstaller does not bundle glibc. Pinning Ubuntu 22.04 (glibc 2.35)
    # deliberately avoids ubuntu-latest's newer 24.04/glibc 2.39 baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout verified source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout, layout, and Linux baseline
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux" && test "$RUNNER_ARCH" = "X64"
          test "$(git rev-parse HEAD)" = "${{ needs.metadata.outputs.source_sha }}"
          for path in logosforge/pyproject.toml logosforge-ui-contracts/package.json pro-shared-ui/package.json pro-desktop/package.json pro-desktop/core/logosforge-core.spec pro-desktop/core/logosforge-mcp.spec pro-desktop/scripts/live-context-core-manager-driver.cjs pro-desktop/scripts/packaged-workspace-acceptance.mjs pro-desktop/scripts/smoke-live-context-bridge.py; do
            test -e "$path" || { echo "::error::Missing required monorepo path: $path"; exit 1; }
          done
          ldd --version | head -n 1

      - name: Install Linux package and smoke-test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libfuse2 libgbm1 libgtk-3-0 libnss3 libportaudio2 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxss1 libxtst6 openbox x11-utils xauth xdg-utils xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            logosforge-ui-contracts/package-lock.json
            pro-shared-ui/package-lock.json
            pro-desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"

      - name: Build a fresh voice-capable frozen core
        run: |
          set -euo pipefail
          rm -rf -- pro-desktop/core/build pro-desktop/core/dist build-venv
          python -m venv build-venv
          ./build-venv/bin/python -m pip install --upgrade pip
          ./build-venv/bin/python -m pip install "./logosforge[export,voice,mcp]" httpx "pyinstaller==6.22.2"
          ./build-venv/bin/python -m pip check
          ./build-venv/bin/python -c "import ctranslate2, faster_whisper, sounddevice; print('voice imports OK', ctranslate2.__version__)"
          ./build-venv/bin/python -m compileall -q logosforge/logosforge pro-desktop/core pro-desktop/scripts/smoke-live-context-bridge.py
          node --check pro-desktop/scripts/live-context-core-manager-driver.cjs
          ./build-venv/bin/python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from logosforge.api import ApiConfig, create_api
          from logosforge.db import Database
          os.environ["LOGOSFORGE_VOICE_MODEL"] = os.path.abspath("missing-release-smoke-model")
          with TestClient(create_api(db=Database(), config=ApiConfig(mode="desktop"))) as client:
              assert client.get("/api/health").json()["service"] == "logosforge-api"
              voice = client.get("/api/voice/status").json()
              assert voice["model_configured"] is True and voice["available"] is False
              assert "Install 'faster-whisper'" not in voice["message"]
          print("source API and faster-whisper status smoke OK")
          PY
          cd pro-desktop/core
          ../../build-venv/bin/python -m PyInstaller logosforge-core.spec --noconfirm --clean --log-level WARN
          ../../build-venv/bin/python -m PyInstaller logosforge-mcp.spec --noconfirm --clean --log-level WARN
          file dist/logosforge-core/logosforge-core
          file dist/logosforge-core/logosforge-core | grep -Eq 'ELF 64-bit.*x86-64'
          file dist/logosforge-mcp
          file dist/logosforge-mcp | grep -Eq 'ELF 64-bit.*x86-64'
          portaudio_files="$(find dist/logosforge-core -type f -iname '*portaudio*' -print)"
          [ -n "$portaudio_files" ] || {
            echo "::error::PyInstaller omitted libportaudio from the voice-capable Linux sidecar."
            exit 1
          }

      - name: Smoke-test frozen core identity and voice import
        run: |
          set -euo pipefail
          CORE_EXE="$PWD/pro-desktop/core/dist/logosforge-core/logosforge-core" \
          EXPECTED_CORE_VERSION="$(./build-venv/bin/python -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/bin/python -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/bin/python - <<'PY'
          import json, os, shutil, signal, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-core-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "core.log"; nonce, token = "release-smoke-nonce", "release-smoke-token"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy(); env.update({"API_AUTH_TOKEN": token, "API_INSTANCE_NONCE": nonce,
              "LOGOSFORGE_VOICE_MODEL": str(work / "deliberately-missing-model"), "LOGOSFORGE_VOICE_DEVICE": "cpu", "LOGOSFORGE_VOICE_COMPUTE": "int8"})
          command = [os.environ["CORE_EXE"], "--host", "127.0.0.1", "--port", str(port), "--mode", "desktop", "--db", str(work / "logosforge.db")]
          proc = None; failure = None
          def get(path, auth=False, timeout=2):
              headers = {"Authorization": f"Bearer {token}"} if auth else {}
              with urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}{path}", headers=headers), timeout=timeout) as response: return json.load(response)
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen(command, cwd=Path(os.environ["CORE_EXE"]).parent, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  health = None
                  for attempt in range(45):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try: health = get("/api/health")
                      except Exception: continue
                      if health.get("status") == "ok": print(f"frozen core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"frozen core did not become healthy (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"], "instance_nonce": nonce}
                  if any(health.get(k) != v for k, v in expected.items()): raise RuntimeError(f"identity mismatch: {health!r}")
                  voice = get("/api/voice/status", True, timeout=30)
                  if voice.get("model_configured") is not True or voice.get("available") is not False: raise RuntimeError(f"voice status: {voice!r}")
                  if "Install 'faster-whisper'" in str(voice.get("message", "")): raise RuntimeError(f"faster-whisper omitted: {voice!r}")
                  print("frozen faster-whisper import path OK (model intentionally absent)")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  try: os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError: pass
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      try: os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError: pass
                      proc.wait(timeout=5)
              for _ in range(20):
                  try: get("/api/health")
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- frozen core log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY

      - name: Smoke-test frozen MCP descriptor and authenticated read
        run: >-
          ./build-venv/bin/python pro-desktop/scripts/smoke-frozen-mcp.py
          pro-desktop/core/dist/logosforge-core/logosforge-core
          --mcp-executable pro-desktop/core/dist/logosforge-mcp

      - name: Test contracts and Pro sources
        run: |
          set -euo pipefail
          cd logosforge-ui-contracts && npm ci && npm test && node ../.github/npm-audit-policy.mjs
          cd ../pro-shared-ui && npm ci && npm test && npm run build && node ../.github/npm-audit-policy.mjs
          cd ../pro-desktop && npm ci && npm test && node ../.github/npm-audit-policy.mjs

      - name: Exercise real CoreManager live context through connector and MCP
        run: >-
          ./build-venv/bin/python pro-desktop/scripts/smoke-live-context-bridge.py
          --core pro-desktop/core/dist/logosforge-core/logosforge-core
          --mcp pro-desktop/core/dist/logosforge-mcp

      - name: Package Linux x64 AppImage
        working-directory: pro-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          rm -rf -- release
          npm run dist:linux

      - name: Exercise packaged Linux Pro pointer workspace and restart persistence
        env:
          LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE: ${{ github.workspace }}/pro-desktop/release/linux-unpacked/logosforge-pro
          LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_ROOT: ${{ runner.temp }}/logosforge-pro-linux-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -x "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE"
          test -s "$(dirname "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE")/resources/app.asar"
          test -x "$(dirname "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE")/resources/core/logosforge-core"
          test -x "$(dirname "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE")/resources/mcp/logosforge-mcp"
          case "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_ROOT" in
            "$RUNNER_TEMP"/logosforge-pro-linux-workspace-acceptance-*) ;;
            *) echo "::error::Unsafe packaged-workspace acceptance root."; exit 1 ;;
          esac
          test ! -e "$LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_ROOT"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            bash -c '
              set -euo pipefail
              wm_log="${RUNNER_TEMP:?}/logosforge-pro-openbox.log"
              openbox --sm-disable >"$wm_log" 2>&1 &
              wm_pid=$!

              cleanup_wm() {
                kill "$wm_pid" 2>/dev/null || true
                wait "$wm_pid" 2>/dev/null || true
              }
              trap cleanup_wm EXIT
              trap "exit 130" INT
              trap "exit 143" TERM

              wm_ready=false
              for _ in $(seq 1 100); do
                if ! kill -0 "$wm_pid" 2>/dev/null; then
                  echo "::error::Openbox exited before becoming ready."
                  cat "$wm_log"
                  exit 1
                fi
                if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null \
                    | grep -Eq "^_NET_SUPPORTING_WM_CHECK\\(WINDOW\\): window id # 0x[0-9A-Fa-f]+$"; then
                  wm_ready=true
                  break
                fi
                sleep 0.1
              done
              if [ "$wm_ready" != true ]; then
                echo "::error::Openbox did not publish _NET_SUPPORTING_WM_CHECK."
                cat "$wm_log"
                exit 1
              fi

              npm --prefix pro-desktop run test:packaged-workspace
            '

      - name: Upload Linux packaged-workspace failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-linux-workspace-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logosforge-pro-linux-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Inspect and launch-smoke AppImage
        run: |
          set -euo pipefail
          expected="pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x86_64.AppImage"
          set -- pro-desktop/release/*.AppImage
          if [ "$#" -ne 1 ] || [ "$1" != "$expected" ] || [ ! -s "$expected" ]; then
            echo "::error::Expected exactly $expected."
            exit 1
          fi
          appimage="$(realpath "$expected")"; chmod +x "$appimage"
          file "$appimage" | grep -Eq 'ELF 64-bit.*x86-64'
          extract_root="$(mktemp -d "$RUNNER_TEMP/logosforge-pro-appimage.XXXXXX")"
          cleanup_extract() {
            case "$extract_root" in
              "$RUNNER_TEMP"/logosforge-pro-appimage.??????) rm -rf -- "$extract_root" ;;
              *) echo "::error::Refusing unsafe AppImage cleanup: $extract_root"; return 1 ;;
            esac
          }
          trap cleanup_extract EXIT INT TERM
          (cd "$extract_root" && "$appimage" --appimage-extract >/dev/null)
          test -x "$extract_root/squashfs-root/AppRun"
          test -s "$extract_root/squashfs-root/resources/app.asar"
          test -x "$extract_root/squashfs-root/resources/core/logosforge-core"
          test -x "$extract_root/squashfs-root/resources/mcp/logosforge-mcp"
          file "$extract_root/squashfs-root/resources/core/logosforge-core" | grep -Eq 'ELF 64-bit.*x86-64'
          file "$extract_root/squashfs-root/resources/mcp/logosforge-mcp" | grep -Eq 'ELF 64-bit.*x86-64'
          portaudio_files="$(find "$extract_root/squashfs-root/resources/core" -type f -iname '*portaudio*' -print)"
          test -n "$portaudio_files"

          APP_EXE="$appimage" \
          EXPECTED_CORE_VERSION="$(./build-venv/bin/python -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/bin/python -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/bin/python - <<'PY'
          import json, os, shutil, signal, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-app-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "app.log"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy(); env.update({"HOME": str(work), "XDG_CONFIG_HOME": str(work / "config"), "LOGOSFORGE_PORT": str(port),
              "LOGOSFORGE_VOICE_MODEL": "", "ELECTRON_ENABLE_LOGGING": "1", "APPIMAGE_EXTRACT_AND_RUN": "1"})
          command = ["xvfb-run", "--auto-servernum", "--server-args=-screen 0 1440x900x24", os.environ["APP_EXE"],
                     "--disable-gpu", f"--user-data-dir={work / 'electron-user-data'}"]
          proc = None; failure = None
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen(command, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  health = None
                  for attempt in range(60):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try:
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=2) as response: health = json.load(response)
                      except Exception: continue
                      if health.get("status") == "ok": print(f"AppImage core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"AppImage did not start core (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"]}
                  if any(health.get(k) != v for k, v in expected.items()) or not health.get("instance_nonce"): raise RuntimeError(f"identity mismatch: {health!r}")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  try: os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError: pass
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      try: os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError: pass
                      proc.wait(timeout=5)
              for _ in range(20):
                  try: urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=.25).close()
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- AppImage log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY

      - name: Exercise packaged Linux MCP companion
        run: >-
          xvfb-run -a ./build-venv/bin/python pro-desktop/scripts/smoke-packaged-mcp.py
          "pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x86_64.AppImage"
          --timeout 120

      - name: Record Linux dependency and artifact provenance
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/logosforge-pro-linux-x64-provenance"
          mkdir -p "$provenance"
          ./build-venv/bin/python -m pip freeze --all > "$provenance/pip-freeze.txt"
          {
            echo "source_sha=${{ needs.metadata.outputs.source_sha }}"
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "platform=linux-x64"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "glibc=$(ldd --version | head -n 1)"
            echo "python=$(./build-venv/bin/python --version 2>&1)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "source_tree_manifest_sha256=$(git ls-tree -r --full-tree '${{ needs.metadata.outputs.source_sha }}' | sha256sum | awk '{print $1}')"
            sha256sum pro-desktop/release/*.AppImage
          } > "$provenance/SHA256SUMS-and-build.txt"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-linux-x64
          path: pro-desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-linux-x64-provenance
          path: ${{ runner.temp }}/logosforge-pro-linux-x64-provenance/*
          if-no-files-found: error
          retention-days: 30

  build_macos:
    name: macOS Intel x64 — test, freeze, smoke, DMG
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_macos == 'true'
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      handoff_digest: ${{ steps.handoff.outputs.digest }}
      handoff_run_attempt: ${{ steps.evidence.outputs.run_attempt }}
    defaults:
      run:
        shell: bash
        working-directory: pro-macos-source
    env:
      CI: "true"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      PYTHONUTF8: "1"

    steps:
      - name: Verify native Intel macOS 12+ release host
        working-directory: .
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "macOS" && test "$RUNNER_ARCH" = "X64"
          host_arch="$(uname -m)"
          if [ "$host_arch" != "x86_64" ]; then echo "::error::Pro Intel requires x86_64; runner reported $host_arch."; exit 1; fi
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')"
          if [ "$translated" = "1" ]; then echo "::error::Pro Intel must run natively, not under Rosetta."; exit 1; fi
          host_version="$(sw_vers -productVersion)"
          host_major="${host_version%%.*}"
          case "$host_major" in ""|*[!0-9]*) echo "::error::Could not parse macOS version: $host_version"; exit 1 ;; esac
          if [ "$host_major" -lt 12 ]; then
            echo "::error::Pro Intel requires macOS 12 or newer; runner reported $host_version."
            exit 1
          fi

          xcode-select -p >/dev/null
          echo "release host OK: macOS $host_version ($host_arch); handoff uses shell and native binaries only"

      - name: Checkout verified source without JavaScript actions
        working-directory: .
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          workspace="$(cd "${GITHUB_WORKSPACE:?}" && pwd -P)"
          case "$workspace" in ""|"/") echo "::error::Unsafe runner workspace: $workspace"; exit 1 ;; esac
          source_root="$workspace/pro-macos-source"
          case "$source_root" in "$workspace"/pro-macos-source) ;; *) echo "::error::Unsafe source directory: $source_root"; exit 1 ;; esac
          if [ -e "$source_root" ] || [ -L "$source_root" ]; then rm -rf -- "$source_root"; fi
          mkdir -p -- "$source_root"
          git -C "$source_root" init --quiet
          git -C "$source_root" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$source_root" fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git -C "$source_root" checkout --detach --force "$SOURCE_SHA"
          actual_sha="$(git -C "$source_root" rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA" || {
            echo "::error::Checkout mismatch: expected $SOURCE_SHA, found $actual_sha."
            exit 1
          }

      - name: Stage trusted macOS handoff evidence control
        id: controls
        run: |
          set -euo pipefail
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          case "$temp_root" in ""|"/") echo "::error::Unsafe runner temp directory: $temp_root"; exit 1 ;; esac
          controls_root="$(mktemp -d "$temp_root/logosforge-pro-release-controls.XXXXXX")"
          case "$controls_root" in "$temp_root"/logosforge-pro-release-controls.??????) ;; *) echo "::error::Unsafe controls directory: $controls_root"; exit 1 ;; esac
          echo "root=$controls_root" >> "$GITHUB_OUTPUT"
          evidence="pro-desktop/scripts/macos-handoff-evidence.py"
          test -f "$evidence" && test ! -L "$evidence" || { echo "::error::Missing handoff evidence control: $evidence"; exit 1; }
          cp -p -- "$evidence" "$controls_root/macos-handoff-evidence.py"
          echo "evidence=$controls_root/macos-handoff-evidence.py" >> "$GITHUB_OUTPUT"

      - name: Locate or bootstrap checksum-pinned Node.js 22
        env:
          NODE_ARCHIVE_SHA256: "8a677b0219178efd6eb0e475457c4afb452b521a92f6e67845a73bd85727f2a8"
          NODE_VERSION: "22.23.3"
        run: |
          set -euo pipefail
          valid_node=""
          while IFS= read -r candidate; do
            [ -x "$candidate" ] || continue
            if "$candidate" -e '
              const [major, minor] = process.versions.node.split(".").map(Number);
              process.exit(process.arch === "x64" && major === 22 && minor >= 12 ? 0 : 1);
            ' 2>/dev/null; then
              valid_node="$candidate"
              break
            fi
          done < <(
            {
              command -v node 2>/dev/null || true
              find "${RUNNER_TOOL_CACHE:-/nonexistent}/node" -path '*/x64/bin/node' -type f 2>/dev/null || true
              printf '%s\n' /usr/local/bin/node /opt/homebrew/bin/node
            } | awk '!seen[$0]++'
          )
          if [ -z "$valid_node" ]; then
            temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
            node_root="$(mktemp -d "$temp_root/logosforge-node.XXXXXX")"
            archive="node-v${NODE_VERSION}-darwin-x64.tar.gz"
            archive_path="$node_root/$archive"
            curl --fail --location --show-error --silent \
              "https://nodejs.org/download/release/v${NODE_VERSION}/${archive}" \
              --output "$archive_path"
            printf '%s  %s\n' "$NODE_ARCHIVE_SHA256" "$archive_path" | shasum -a 256 --check
            tar -xzf "$archive_path" -C "$node_root"
            valid_node="$node_root/node-v${NODE_VERSION}-darwin-x64/bin/node"
          fi
          node_bin="$(cd "$(dirname "$valid_node")" && pwd -P)"
          "$node_bin/node" -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (process.arch !== "x64" || major !== 22 || minor < 12) process.exit(1);
          '
          echo "$node_bin" >> "$GITHUB_PATH"
          echo "Using $($node_bin/node --version) from $node_bin."

      - name: Verify checkout and monorepo layout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.metadata.outputs.source_sha }}"
          for path in logosforge/pyproject.toml logosforge-ui-contracts/package.json pro-shared-ui/package.json pro-desktop/package.json pro-desktop/core/logosforge-core.spec pro-desktop/core/logosforge-mcp.spec pro-desktop/scripts/live-context-core-manager-driver.cjs pro-desktop/scripts/macos-handoff-evidence.py pro-desktop/scripts/packaged-workspace-acceptance.mjs pro-desktop/scripts/smoke-live-context-bridge.py whiteboard-desktop/scripts/check-macos-deployment-targets.py; do
            test -e "$path" || { echo "::error::Missing required monorepo path: $path"; exit 1; }
          done

      - name: Locate Python 3.11–3.13
        id: py
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:/Library/Frameworks/Python.framework/Versions/3.11/bin:/Library/Frameworks/Python.framework/Versions/3.12/bin:/Library/Frameworks/Python.framework/Versions/3.13/bin:$PATH"
          for candidate in python3.11 python3.12 python3.13 python3; do
            interpreter="$(command -v "$candidate" 2>/dev/null)" || continue
            version="$("$interpreter" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null)" || continue
            case "$version" in
              3.11|3.12|3.13) echo "python=$interpreter" >> "$GITHUB_OUTPUT"; echo "Using $interpreter (Python $version)"; exit 0 ;;
            esac
          done
          echo "::error::No Python 3.11, 3.12, or 3.13 is installed on the Intel Mac runner."
          exit 1

      - name: Self-test macOS handoff evidence control
        run: >-
          "${{ steps.py.outputs.python }}"
          "${{ steps.controls.outputs.evidence }}"
          --self-test

      - name: Build a fresh voice-capable frozen core
        run: |
          set -euo pipefail
          rm -rf -- pro-desktop/core/build pro-desktop/core/dist build-venv
          "${{ steps.py.outputs.python }}" -m venv build-venv
          ./build-venv/bin/python -m pip install --upgrade pip
          ./build-venv/bin/python -m pip install "./logosforge[export,voice,mcp]" httpx "pyinstaller==6.22.2"
          ./build-venv/bin/python -m pip check
          ./build-venv/bin/python -c "import ctranslate2, faster_whisper, sounddevice; print('voice imports OK', ctranslate2.__version__)"
          ./build-venv/bin/python -m compileall -q logosforge/logosforge pro-desktop/core pro-desktop/scripts/smoke-live-context-bridge.py
          node --check pro-desktop/scripts/live-context-core-manager-driver.cjs
          ./build-venv/bin/python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from logosforge.api import ApiConfig, create_api
          from logosforge.db import Database
          os.environ["LOGOSFORGE_VOICE_MODEL"] = os.path.abspath("missing-release-smoke-model")
          with TestClient(create_api(db=Database(), config=ApiConfig(mode="desktop"))) as client:
              assert client.get("/api/health").json()["service"] == "logosforge-api"
              voice = client.get("/api/voice/status").json()
              assert voice["model_configured"] is True and voice["available"] is False
              assert "Install 'faster-whisper'" not in voice["message"]
          print("source API and faster-whisper status smoke OK")
          PY
          cd pro-desktop/core
          ../../build-venv/bin/python -m PyInstaller logosforge-core.spec --noconfirm --clean --log-level WARN
          ../../build-venv/bin/python -m PyInstaller logosforge-mcp.spec --noconfirm --clean --log-level WARN
          file dist/logosforge-core/logosforge-core
          file dist/logosforge-core/logosforge-core | grep -Eq 'Mach-O 64-bit executable x86_64'
          file dist/logosforge-mcp
          file dist/logosforge-mcp | grep -Eq 'Mach-O 64-bit executable x86_64'
          portaudio_files="$(find dist/logosforge-core -type f -iname '*portaudio*' -print)"
          [ -n "$portaudio_files" ] || {
            echo "::error::PyInstaller omitted PortAudio from the voice-capable macOS sidecar."
            exit 1
          }

      - name: Smoke-test frozen core identity and voice import
        run: |
          set -euo pipefail
          CORE_EXE="$PWD/pro-desktop/core/dist/logosforge-core/logosforge-core" \
          EXPECTED_CORE_VERSION="$(./build-venv/bin/python -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/bin/python -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/bin/python - <<'PY'
          import json, os, shutil, signal, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-core-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "core.log"; nonce, token = "release-smoke-nonce", "release-smoke-token"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy(); env.update({"API_AUTH_TOKEN": token, "API_INSTANCE_NONCE": nonce,
              "LOGOSFORGE_VOICE_MODEL": str(work / "deliberately-missing-model"), "LOGOSFORGE_VOICE_DEVICE": "cpu", "LOGOSFORGE_VOICE_COMPUTE": "int8"})
          command = [os.environ["CORE_EXE"], "--host", "127.0.0.1", "--port", str(port), "--mode", "desktop", "--db", str(work / "logosforge.db")]
          proc = None; failure = None
          def get(path, auth=False, timeout=2):
              headers = {"Authorization": f"Bearer {token}"} if auth else {}
              with urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}{path}", headers=headers), timeout=timeout) as response: return json.load(response)
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen(command, cwd=Path(os.environ["CORE_EXE"]).parent, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  health = None
                  for attempt in range(45):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try: health = get("/api/health")
                      except Exception: continue
                      if health.get("status") == "ok": print(f"frozen core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"frozen core did not become healthy (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"], "instance_nonce": nonce}
                  if any(health.get(k) != v for k, v in expected.items()): raise RuntimeError(f"identity mismatch: {health!r}")
                  voice = get("/api/voice/status", True, timeout=30)
                  if voice.get("model_configured") is not True or voice.get("available") is not False: raise RuntimeError(f"voice status: {voice!r}")
                  if "Install 'faster-whisper'" in str(voice.get("message", "")): raise RuntimeError(f"faster-whisper omitted: {voice!r}")
                  print("frozen faster-whisper import path OK (model intentionally absent)")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  try: os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError: pass
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      try: os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError: pass
                      proc.wait(timeout=5)
              for _ in range(20):
                  try: get("/api/health")
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- frozen core log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY

      - name: Smoke-test frozen MCP descriptor and authenticated read
        run: >-
          ./build-venv/bin/python pro-desktop/scripts/smoke-frozen-mcp.py
          pro-desktop/core/dist/logosforge-core/logosforge-core
          --mcp-executable pro-desktop/core/dist/logosforge-mcp

      - name: Test contracts and Pro sources
        run: |
          set -euo pipefail
          cd logosforge-ui-contracts && npm ci && npm test && node ../.github/npm-audit-policy.mjs
          cd ../pro-shared-ui && npm ci && npm test && npm run build && node ../.github/npm-audit-policy.mjs
          cd ../pro-desktop && npm ci && npm test && node ../.github/npm-audit-policy.mjs

      - name: Exercise real CoreManager live context through connector and MCP
        run: >-
          ./build-venv/bin/python pro-desktop/scripts/smoke-live-context-bridge.py
          --core pro-desktop/core/dist/logosforge-core/logosforge-core
          --mcp pro-desktop/core/dist/logosforge-mcp

      - name: Package unsigned macOS Intel DMG
        working-directory: pro-macos-source/pro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          rm -rf -- release
          npm run dist:mac

      - name: Inspect Mach-O deployment targets
        run: |
          set -euo pipefail
          set -- pro-desktop/release/mac*/LogosForge\ Pro.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "::error::Expected exactly one unpacked macOS app bundle."
            exit 1
          fi
          app_dir="$1"
          ./build-venv/bin/python \
            whiteboard-desktop/scripts/check-macos-deployment-targets.py \
            --self-test
          ./build-venv/bin/python \
            whiteboard-desktop/scripts/check-macos-deployment-targets.py \
            "$app_dir" \
            --maximum 12.0.0

      - name: Mount, inspect, and launch-smoke DMG
        run: |
          set -euo pipefail
          expected="pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64.dmg"
          set -- pro-desktop/release/*.dmg
          if [ "$#" -ne 1 ] || [ "$1" != "$expected" ] || [ ! -s "$expected" ]; then
            echo "::error::Expected exactly $expected."
            exit 1
          fi
          dmg="$(cd "$(dirname "$expected")" && pwd -P)/$(basename "$expected")"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/logosforge-pro-dmg.XXXXXX")"; attached=false
          cleanup_mount() {
            rc="${1:-$?}"; trap - EXIT INT TERM
            if [ "$attached" = "true" ]; then hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || rc=1; fi
            case "$mount_dir" in "$RUNNER_TEMP"/logosforge-pro-dmg.??????) rmdir "$mount_dir" 2>/dev/null || true ;; *) rc=1 ;; esac
            exit "$rc"
          }
          trap 'cleanup_mount $?' EXIT; trap 'cleanup_mount 130' INT; trap 'cleanup_mount 143' TERM
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null; attached=true
          app_dir="$mount_dir/LogosForge Pro.app"; app_exe="$app_dir/Contents/MacOS/LogosForge Pro"; core_exe="$app_dir/Contents/Resources/core/logosforge-core"; mcp_exe="$app_dir/Contents/Resources/mcp/logosforge-mcp"; plist="$app_dir/Contents/Info.plist"
          test -x "$app_exe"; test -x "$core_exe"; test -x "$mcp_exe"; test -s "$app_dir/Contents/Resources/app.asar"; test -s "$plist"
          portaudio_files="$(find "$app_dir/Contents/Resources/core" -type f -iname '*portaudio*' -print)"
          test -n "$portaudio_files"
          file "$app_exe" | grep -Eq 'Mach-O 64-bit executable x86_64'
          file "$core_exe" | grep -Eq 'Mach-O 64-bit executable x86_64'
          file "$mcp_exe" | grep -Eq 'Mach-O 64-bit executable x86_64'
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          test "$bundle_version" = "${{ needs.metadata.outputs.version }}" || { echo "::error::DMG version mismatch: $bundle_version"; exit 1; }
          minimum_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")"
          test "$minimum_version" = "12.0.0" || { echo "::error::DMG macOS floor mismatch: $minimum_version"; exit 1; }
          microphone_reason="$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist")"
          test -n "$microphone_reason" || { echo "::error::DMG is missing its microphone usage description."; exit 1; }
          packaged_electron_version="$(ELECTRON_RUN_AS_NODE=1 "$app_exe" -p 'process.versions.electron')"
          case "$packaged_electron_version" in
            43.*) ;;
            *) echo "::error::Expected packaged Electron 43.x, found $packaged_electron_version."; exit 1 ;;
          esac

          APP_EXE="$app_exe" \
          EXPECTED_CORE_VERSION="$(./build-venv/bin/python -c 'import logosforge; print(logosforge.__version__)')" \
          EXPECTED_API_VERSION="$(./build-venv/bin/python -c 'from logosforge.api.app import API_CONTRACT_VERSION; print(API_CONTRACT_VERSION)')" \
          ./build-venv/bin/python - <<'PY'
          import json, os, shutil, signal, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          work = Path(tempfile.mkdtemp(prefix="logosforge-pro-app-smoke-", dir=root)).resolve()
          if work.parent != root: raise SystemExit(f"unsafe smoke directory: {work}")
          log_path = work / "app.log"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0)); port = probe.getsockname()[1]
          env = os.environ.copy(); env.update({"HOME": str(work), "LOGOSFORGE_PORT": str(port), "LOGOSFORGE_VOICE_MODEL": "", "ELECTRON_ENABLE_LOGGING": "1"})
          command = [os.environ["APP_EXE"], "--disable-gpu", f"--user-data-dir={work / 'electron-user-data'}"]
          proc = None; failure = None
          try:
              with log_path.open("wb") as log:
                  proc = subprocess.Popen(command, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  health = None
                  for attempt in range(60):
                      time.sleep(1)
                      if proc.poll() is not None: break
                      try:
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=2) as response: health = json.load(response)
                      except Exception: continue
                      if health.get("status") == "ok": print(f"DMG app core healthy after {attempt + 1}s"); break
                  if health is None: raise RuntimeError(f"DMG app did not start core (exit={proc.poll()})")
                  expected = {"status": "ok", "service": "logosforge-api", "mode": "desktop",
                              "version": os.environ["EXPECTED_API_VERSION"], "api_version": os.environ["EXPECTED_API_VERSION"],
                              "core_version": os.environ["EXPECTED_CORE_VERSION"]}
                  if any(health.get(k) != v for k, v in expected.items()) or not health.get("instance_nonce"): raise RuntimeError(f"identity mismatch: {health!r}")
          except Exception as exc: failure = exc
          finally:
              if proc is not None and proc.poll() is None:
                  try: os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError: pass
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      try: os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError: pass
                      proc.wait(timeout=5)
              for _ in range(20):
                  try: urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=.25).close()
                  except Exception: break
                  time.sleep(.25)
              else: failure = failure or RuntimeError(f"port {port} remained open")
              if failure and log_path.exists(): print("--- DMG app log ---\n" + log_path.read_text(errors="replace"))
              shutil.rmtree(work)
          if failure: raise failure
          PY

      - name: Exercise packaged macOS MCP companion
        run: >-
          ./build-venv/bin/python pro-desktop/scripts/smoke-packaged-mcp.py
          "pro-desktop/release/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64.dmg"
          --timeout 120

      - name: Exercise packaged macOS Pro pointer workspace and restart persistence
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/logosforge-pro-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set -- pro-desktop/release/mac*/LogosForge\ Pro.app/Contents/MacOS/LogosForge\ Pro
          if [ "$#" -ne 1 ] || [ ! -x "$1" ]; then
            echo "::error::Expected exactly one unpacked macOS Pro executable."
            exit 1
          fi
          app_exe="$(cd "$(dirname "$1")" && pwd -P)/$(basename "$1")"
          LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_EXE="$app_exe" \
          LOGOSFORGE_PRO_WORKSPACE_ACCEPTANCE_ROOT="$ACCEPTANCE_ROOT" \
            npm --prefix pro-desktop run test:packaged-workspace

      - name: Preserve macOS packaged-workspace failure diagnostics on the host
        if: failure()
        working-directory: .
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/logosforge-pro-workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ ! -d "$ACCEPTANCE_ROOT" ]; then
            echo "::notice::No packaged-workspace diagnostics directory was created."
            exit 0
          fi
          workspace="$(cd "${GITHUB_WORKSPACE:?}" && pwd -P)"
          case "$workspace" in ""|"/") echo "::error::Unsafe runner workspace: $workspace"; exit 1 ;; esac
          drop="$workspace/macos-build-drop/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/acceptance-diagnostics"
          case "$drop" in "$workspace"/macos-build-drop/run-*/acceptance-diagnostics) ;; *) echo "::error::Unsafe diagnostics target: $drop"; exit 1 ;; esac
          mkdir -p -- "$drop"
          cp -R -- "$ACCEPTANCE_ROOT"/. "$drop"/
          echo "::notice::Packaged-workspace failure diagnostics preserved at $drop"
          {
            echo "### macOS packaged-workspace failure diagnostics"
            echo
            echo "The retained diagnostics remain on the self-hosted Mac at:"
            echo
            echo '```text'
            echo "$drop"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record macOS dependency and artifact provenance
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/logosforge-pro-macos-intel-x64-provenance"
          case "$provenance" in "$RUNNER_TEMP"/logosforge-pro-macos-intel-x64-provenance) ;; *) echo "::error::Unsafe provenance directory: $provenance"; exit 1 ;; esac
          if [ -e "$provenance" ] || [ -L "$provenance" ]; then rm -rf -- "$provenance"; fi
          mkdir -p "$provenance"
          ./build-venv/bin/python -m pip freeze --all > "$provenance/pip-freeze.txt"
          {
            echo "source_sha=${{ needs.metadata.outputs.source_sha }}"
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "platform=macos-intel-x64"
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow=.github/workflows/release-windows.yml"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "host=$(sw_vers -productVersion)"
            echo "python=$(./build-venv/bin/python --version 2>&1)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "source_tree_manifest_sha256=$(git ls-tree -r --full-tree '${{ needs.metadata.outputs.source_sha }}' | shasum -a 256 | awk '{print $1}')"
            shasum -a 256 pro-desktop/release/*.dmg
          } > "$provenance/SHA256SUMS-and-build.txt"

      - name: Create source-bound macOS handoff evidence
        id: evidence
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          handoff_root="$temp_root/logosforge-pro-macos-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$handoff_root" in "$temp_root"/logosforge-pro-macos-handoff-*-*) ;; *) echo "::error::Unsafe handoff directory: $handoff_root"; exit 1 ;; esac
          if [ -e "$handoff_root" ] || [ -L "$handoff_root" ]; then rm -rf -- "$handoff_root"; fi
          mkdir -m 700 -- "$handoff_root"
          staging="$handoff_root/payload"
          echo "root=$handoff_root" >> "$GITHUB_OUTPUT"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          dmg="pro-desktop/release/LogosForge Pro-${VERSION}-x64.dmg"
          provenance="$temp_root/logosforge-pro-macos-intel-x64-provenance"
          source_tree_sha256="$(git ls-tree -r --full-tree "$SOURCE_SHA" | shasum -a 256 | awk '{print $1}')"
          "${{ steps.py.outputs.python }}" "${{ steps.controls.outputs.evidence }}" create \
            --staging-dir "$staging" \
            --dmg "$dmg" \
            --pip-freeze "$provenance/pip-freeze.txt" \
            --sha256s-and-build "$provenance/SHA256SUMS-and-build.txt" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha256 "$source_tree_sha256" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" \
            --platform macos-intel-x64 \
            --dmg-name "LogosForge Pro-${VERSION}-x64.dmg"

      - name: Bootstrap checksum-pinned ORAS for the Monterey handoff
        id: oras
        working-directory: .
        env:
          ORAS_ARCHIVE_SHA256: "5e964f3d5a36eb9499a9d3e252a86b09e7adf3e6f6447eec56fd249c6702af7e"
          ORAS_VERSION: "1.3.4"
        run: |
          set -euo pipefail
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          case "$temp_root" in ""|"/") echo "::error::Unsafe runner temp directory: $temp_root"; exit 1 ;; esac
          oras_root="$(mktemp -d "$temp_root/logosforge-oras.XXXXXX")"
          case "$oras_root" in "$temp_root"/logosforge-oras.??????) ;; *) echo "::error::Unsafe ORAS directory: $oras_root"; exit 1 ;; esac
          echo "root=$oras_root" >> "$GITHUB_OUTPUT"
          archive="oras_${ORAS_VERSION}_darwin_amd64.tar.gz"
          archive_path="$oras_root/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 --show-error --silent \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$ORAS_ARCHIVE_SHA256" "$archive_path" | shasum -a 256 --check
          oras_bin="$oras_root/oras"
          tar -xOf "$archive_path" oras > "$oras_bin"
          chmod 700 "$oras_bin"
          "$oras_bin" version | grep -Eq 'Version:[[:space:]]+1\.3\.4'
          echo "bin=$oras_bin" >> "$GITHUB_OUTPUT"

      - name: Transfer verified Monterey candidate by immutable GHCR digest
        id: handoff
        env:
          GHCR_TOKEN: ${{ github.token }}
          HANDOFF_ROOT: ${{ steps.evidence.outputs.root }}
          HANDOFF_STAGING: ${{ steps.evidence.outputs.staging }}
          ORAS_BIN: ${{ steps.oras.outputs.bin }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          case "$HANDOFF_ROOT" in "$RUNNER_TEMP"/logosforge-pro-macos-handoff-*-*) ;; *) echo "::error::Unsafe handoff root: $HANDOFF_ROOT"; exit 1 ;; esac
          test "$HANDOFF_STAGING" = "$HANDOFF_ROOT/payload"
          test -x "$ORAS_BIN"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository_name="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
          for component in "$owner" "$repository_name"; do
            printf '%s\n' "$component" | grep -Eq '^[a-z0-9][a-z0-9._-]*$' || {
              echo "::error::Unsafe GHCR package component."
              exit 1
            }
          done
          package="ghcr.io/${owner}/${repository_name}-pro-macos-handoff"
          reference="${package}:run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          registry_config="$HANDOFF_ROOT/registry-config.json"
          push_result="$HANDOFF_ROOT/oras-push.json"
          cleanup_registry_auth() {
            rc=$?
            trap - EXIT INT TERM
            "$ORAS_BIN" logout --registry-config "$registry_config" ghcr.io >/dev/null 2>&1 || true
            rm -f -- "$registry_config"
            exit "$rc"
          }
          trap cleanup_registry_auth EXIT INT TERM
          printf '%s' "$GHCR_TOKEN" | "$ORAS_BIN" login \
            --registry-config "$registry_config" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io
          cd "$HANDOFF_STAGING"
          "$ORAS_BIN" push \
            --registry-config "$registry_config" \
            --artifact-type application/vnd.logosforge.pro.macos-handoff.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "io.logosforge.repository-id=${GITHUB_REPOSITORY_ID}" \
            --annotation "io.logosforge.workflow-ref=${GITHUB_WORKFLOW_REF}" \
            --annotation "io.logosforge.workflow-sha=${GITHUB_WORKFLOW_SHA}" \
            --annotation "io.logosforge.run-id=${GITHUB_RUN_ID}" \
            --annotation "io.logosforge.run-attempt=${GITHUB_RUN_ATTEMPT}" \
            --format json \
            "$reference" \
            "LogosForge Pro-${VERSION}-x64.dmg:application/x-apple-diskimage" \
            "macos-handoff.json:application/json" \
            "pip-freeze.txt:text/plain" \
            "SHA256SUMS-and-build.txt:text/plain" > "$push_result"
          digest="$("${{ steps.py.outputs.python }}" -c 'import json, re, sys; value=json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""); sys.stdout.write(value if re.fullmatch(r"sha256:[0-9a-f]{64}", value) else "")' "$push_result")"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::ORAS did not return a valid immutable handoff digest."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::Verified macOS handoff transferred as ${package}@${digest}"

      - name: Preserve build-only or failed-handoff Monterey candidate on the Mac host
        if: ${{ always() && steps.evidence.outcome == 'success' && (needs.metadata.outputs.publish != 'true' || steps.handoff.outcome != 'success') }}
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          workspace="$(cd "${GITHUB_WORKSPACE:?}" && pwd -P)"
          case "$workspace" in ""|"/") echo "::error::Unsafe runner workspace: $workspace"; exit 1 ;; esac
          source_dmg="pro-desktop/release/LogosForge Pro-${VERSION}-x64.dmg"
          test -s "$source_dmg" || { echo "::error::Verified DMG is missing: $source_dmg"; exit 1; }
          drop="$workspace/macos-build-drop/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "$drop/provenance"
          cp -p -- "$source_dmg" "$drop/"
          cp -p -- "$RUNNER_TEMP/logosforge-pro-macos-intel-x64-provenance/"* "$drop/provenance/"
          cp -p -- "${{ steps.evidence.outputs.staging }}/macos-handoff.json" "$drop/provenance/"
          shasum -a 256 "$drop/LogosForge Pro-${VERSION}-x64.dmg" > "$drop/SHA256SUMS.txt"
          echo "::notice::Verified Monterey candidate preserved at $drop"
          {
            echo "### Monterey build-only candidate"
            echo
            echo "The verified Pro DMG remains on the self-hosted Mac at:"
            echo
            echo '```text'
            echo "$drop"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean isolated macOS checkout and handoff controls
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          workspace="$(cd "${GITHUB_WORKSPACE:?}" && pwd -P)"
          case "$workspace" in ""|"/") echo "::error::Unsafe runner workspace: $workspace"; exit 1 ;; esac
          source_root="$workspace/pro-macos-source"
          case "$source_root" in "$workspace"/pro-macos-source) ;; *) echo "::error::Unsafe source cleanup target: $source_root"; exit 1 ;; esac
          if [ -e "$source_root" ] || [ -L "$source_root" ]; then rm -rf -- "$source_root"; fi
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          controls_root="${{ steps.controls.outputs.root }}"
          oras_root="${{ steps.oras.outputs.root }}"
          handoff_root="${{ steps.evidence.outputs.root }}"
          if [ -n "$controls_root" ]; then
            case "$controls_root" in "$temp_root"/logosforge-pro-release-controls.??????) rm -rf -- "$controls_root" ;; *) echo "::error::Unsafe controls cleanup target: $controls_root"; exit 1 ;; esac
          fi
          if [ -n "$oras_root" ]; then
            case "$oras_root" in "$temp_root"/logosforge-oras.??????) rm -rf -- "$oras_root" ;; *) echo "::error::Unsafe ORAS cleanup target: $oras_root"; exit 1 ;; esac
          fi
          if [ -n "$handoff_root" ]; then
            case "$handoff_root" in "$temp_root"/logosforge-pro-macos-handoff-*-*) rm -rf -- "$handoff_root" ;; *) echo "::error::Unsafe handoff cleanup target: $handoff_root"; exit 1 ;; esac
          fi

  ingest_macos:
    name: Verify and ingest Monterey handoff
    needs: [metadata, build_macos]
    if: ${{ always() && needs.metadata.result == 'success' && needs.metadata.outputs.build_macos == 'true' && needs.build_macos.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      dmg_sha256: ${{ steps.ingest.outputs.dmg_sha256 }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the exact trusted verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and self-test the handoff evidence control
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f pro-desktop/scripts/macos-handoff-evidence.py
          test ! -L pro-desktop/scripts/macos-handoff-evidence.py
          python3 pro-desktop/scripts/macos-handoff-evidence.py --self-test

      - name: Bootstrap checksum-pinned ORAS for hosted ingestion
        id: oras
        env:
          ORAS_ARCHIVE_SHA256: "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454"
          ORAS_VERSION: "1.3.4"
        run: |
          set -euo pipefail
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          case "$temp_root" in ""|"/") echo "::error::Unsafe runner temp directory: $temp_root"; exit 1 ;; esac
          oras_root="$(mktemp -d "$temp_root/logosforge-oras.XXXXXX")"
          case "$oras_root" in "$temp_root"/logosforge-oras.??????) ;; *) echo "::error::Unsafe ORAS directory: $oras_root"; exit 1 ;; esac
          echo "root=$oras_root" >> "$GITHUB_OUTPUT"
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          archive_path="$oras_root/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 --show-error --silent \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$ORAS_ARCHIVE_SHA256" "$archive_path" | sha256sum --check
          oras_bin="$oras_root/oras"
          tar -xOf "$archive_path" oras > "$oras_bin"
          chmod 700 "$oras_bin"
          "$oras_bin" version | grep -Eq 'Version:[[:space:]]+1\.3\.4'
          echo "bin=$oras_bin" >> "$GITHUB_OUTPUT"

      - name: Pull by digest and verify the complete handoff contract
        id: ingest
        env:
          GHCR_TOKEN: ${{ github.token }}
          HANDOFF_DIGEST: ${{ needs.build_macos.outputs.handoff_digest }}
          HANDOFF_RUN_ATTEMPT: ${{ needs.build_macos.outputs.handoff_run_attempt }}
          ORAS_BIN: ${{ steps.oras.outputs.bin }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$HANDOFF_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::The Monterey job did not return a valid immutable digest."
            exit 1
          }
          printf '%s\n' "$HANDOFF_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$' || {
            echo "::error::The Monterey job did not return a valid producer attempt."
            exit 1
          }
          test -x "$ORAS_BIN"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository_name="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
          for component in "$owner" "$repository_name"; do
            printf '%s\n' "$component" | grep -Eq '^[a-z0-9][a-z0-9._-]*$' || {
              echo "::error::Unsafe GHCR package component."
              exit 1
            }
          done
          package="ghcr.io/${owner}/${repository_name}-pro-macos-handoff"
          reference="${package}@${HANDOFF_DIGEST}"

          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          case "$temp_root" in ""|"/") echo "::error::Unsafe runner temp directory: $temp_root"; exit 1 ;; esac
          ingest_root="$temp_root/logosforge-pro-macos-ingest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ingest_root" in "$temp_root"/logosforge-pro-macos-ingest-*-*) ;; *) echo "::error::Unsafe ingest directory: $ingest_root"; exit 1 ;; esac
          if [ -e "$ingest_root" ] || [ -L "$ingest_root" ]; then rm -rf -- "$ingest_root"; fi
          mkdir -m 700 -- "$ingest_root"
          payload="$ingest_root/payload"
          mkdir -m 700 -- "$payload"
          manifest="$ingest_root/oci-manifest.json"
          registry_config="$ingest_root/registry-config.json"
          echo "root=$ingest_root" >> "$GITHUB_OUTPUT"

          cleanup_registry_auth() {
            rc=$?
            trap - EXIT INT TERM
            "$ORAS_BIN" logout --registry-config "$registry_config" ghcr.io >/dev/null 2>&1 || true
            rm -f -- "$registry_config"
            exit "$rc"
          }
          trap cleanup_registry_auth EXIT INT TERM
          printf '%s' "$GHCR_TOKEN" | "$ORAS_BIN" login \
            --registry-config "$registry_config" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io
          "$ORAS_BIN" manifest fetch \
            --registry-config "$registry_config" \
            --output "$manifest" \
            "$reference"
          test -f "$manifest" && test ! -L "$manifest" || {
            echo "::error::Fetched OCI manifest is not a regular non-symlink file."
            exit 1
          }
          manifest_size="$(wc -c < "$manifest" | tr -d '[:space:]')"
          case "$manifest_size" in ""|*[!0-9]*) echo "::error::Could not measure the fetched OCI manifest."; exit 1 ;; esac
          if [ "$manifest_size" -lt 1 ] || [ "$manifest_size" -gt 1048576 ]; then
            echo "::error::Fetched OCI manifest must be between 1 byte and 1 MiB."
            exit 1
          fi
          observed_manifest_digest="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
          if [ "$observed_manifest_digest" != "$HANDOFF_DIGEST" ]; then
            echo "::error::Fetched OCI manifest does not match the build job digest."
            exit 1
          fi

          EXPECTED_DMG="LogosForge Pro-${VERSION}-x64.dmg" \
          EXPECTED_SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          python3 - "$manifest" <<'PY'
          import json
          import os
          import re
          import sys

          manifest_path = sys.argv[1]
          with open(manifest_path, "r", encoding="utf-8") as handle:
              value = json.load(handle)
          if value.get("schemaVersion") != 2:
              raise SystemExit("::error::OCI handoff schemaVersion must be 2.")
          if value.get("artifactType") != "application/vnd.logosforge.pro.macos-handoff.v1":
              raise SystemExit("::error::OCI handoff artifactType mismatch.")
          annotations = value.get("annotations")
          if not isinstance(annotations, dict):
              raise SystemExit("::error::OCI handoff annotations are missing.")
          expected_annotations = {
              "org.opencontainers.image.source": os.environ["EXPECTED_SOURCE_URL"],
              "org.opencontainers.image.revision": os.environ["SOURCE_SHA"],
              "org.opencontainers.image.version": os.environ["VERSION"],
              "io.logosforge.repository-id": os.environ["GITHUB_REPOSITORY_ID"],
              "io.logosforge.workflow-ref": os.environ["GITHUB_WORKFLOW_REF"],
              "io.logosforge.workflow-sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "io.logosforge.run-id": os.environ["GITHUB_RUN_ID"],
              "io.logosforge.run-attempt": os.environ["HANDOFF_RUN_ATTEMPT"],
          }
          for key, expected in expected_annotations.items():
              if annotations.get(key) != expected:
                  raise SystemExit(f"::error::OCI handoff annotation mismatch: {key}")
          expected_layers = {
              os.environ["EXPECTED_DMG"]: ("application/x-apple-diskimage", 8 * 1024 * 1024 * 1024),
              "macos-handoff.json": ("application/json", 1024 * 1024),
              "pip-freeze.txt": ("text/plain", 32 * 1024 * 1024),
              "SHA256SUMS-and-build.txt": ("text/plain", 32 * 1024 * 1024),
          }
          layers = value.get("layers")
          if not isinstance(layers, list) or len(layers) != len(expected_layers):
              raise SystemExit("::error::OCI handoff must contain exactly four layers.")
          observed = {}
          for layer in layers:
              if not isinstance(layer, dict):
                  raise SystemExit("::error::OCI handoff contains an invalid layer descriptor.")
              layer_annotations = layer.get("annotations")
              title = layer_annotations.get("org.opencontainers.image.title") if isinstance(layer_annotations, dict) else None
              if title not in expected_layers or title in observed:
                  raise SystemExit("::error::OCI handoff layer titles are not exact and unique.")
              expected_media_type, maximum_size = expected_layers[title]
              if layer.get("mediaType") != expected_media_type:
                  raise SystemExit(f"::error::OCI handoff media type mismatch: {title}")
              if (
                  isinstance(layer.get("size"), bool)
                  or not isinstance(layer.get("size"), int)
                  or layer["size"] < 1
                  or layer["size"] > maximum_size
              ):
                  raise SystemExit(f"::error::OCI handoff layer size is invalid: {title}")
              if re.fullmatch(r"sha256:[0-9a-f]{64}", str(layer.get("digest", ""))) is None:
                  raise SystemExit(f"::error::OCI handoff layer digest is invalid: {title}")
              observed[title] = layer
          if set(observed) != set(expected_layers):
              raise SystemExit("::error::OCI handoff layer set mismatch.")
          PY

          "$ORAS_BIN" pull \
            --registry-config "$registry_config" \
            --output "$payload" \
            "$reference"
          source_tree_sha256="$(git ls-tree -r --full-tree "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          python3 pro-desktop/scripts/macos-handoff-evidence.py verify \
            --staging-dir "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha256 "$source_tree_sha256" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$HANDOFF_RUN_ATTEMPT" \
            --version "$VERSION" \
            --platform macos-intel-x64 \
            --dmg-name "LogosForge Pro-${VERSION}-x64.dmg"

          PAYLOAD="$payload" EXPECTED_DMG="LogosForge Pro-${VERSION}-x64.dmg" \
          python3 - "$manifest" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              layers = json.load(handle)["layers"]
          payload = pathlib.Path(os.environ["PAYLOAD"])
          expected_names = {
              os.environ["EXPECTED_DMG"],
              "macos-handoff.json",
              "pip-freeze.txt",
              "SHA256SUMS-and-build.txt",
          }
          descriptors = {
              layer["annotations"]["org.opencontainers.image.title"]: layer
              for layer in layers
          }
          if set(descriptors) != expected_names:
              raise SystemExit("::error::Pulled OCI descriptor set changed during ingestion.")
          for name in sorted(expected_names):
              path = payload / name
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              descriptor = descriptors[name]
              if path.stat().st_size != descriptor["size"]:
                  raise SystemExit(f"::error::Pulled OCI layer size mismatch: {name}")
              if f"sha256:{digest.hexdigest()}" != descriptor["digest"]:
                  raise SystemExit(f"::error::Pulled OCI layer digest mismatch: {name}")
          PY

          dmg_sha256="$(sha256sum "$payload/LogosForge Pro-${VERSION}-x64.dmg" | awk '{print $1}')"
          printf '%s\n' "$dmg_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice::Verified ${reference} and admitted the Monterey DMG to Actions artifacts."

      - name: Upload verified macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-macos-intel-x64
          path: ${{ steps.ingest.outputs.payload }}/LogosForge Pro-${{ needs.metadata.outputs.version }}-x64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload verified macOS provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: logosforge-pro-macos-intel-x64-provenance
          path: |
            ${{ steps.ingest.outputs.payload }}/macos-handoff.json
            ${{ steps.ingest.outputs.payload }}/pip-freeze.txt
            ${{ steps.ingest.outputs.payload }}/SHA256SUMS-and-build.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Clean hosted macOS ingest state
        if: always()
        run: |
          set -euo pipefail
          temp_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
          ingest_root="$temp_root/logosforge-pro-macos-ingest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ingest_root" in "$temp_root"/logosforge-pro-macos-ingest-*-*) rm -rf -- "$ingest_root" ;; *) echo "::error::Unsafe ingest cleanup target: $ingest_root"; exit 1 ;; esac
          oras_root="${{ steps.oras.outputs.root }}"
          if [ -n "$oras_root" ]; then
            case "$oras_root" in "$temp_root"/logosforge-oras.??????) rm -rf -- "$oras_root" ;; *) echo "::error::Unsafe ORAS cleanup target: $oras_root"; exit 1 ;; esac
          fi

  publish:
    name: Publish verified native prerelease
    needs: [metadata, quality, build_windows, build_linux, build_macos, ingest_macos]
    if: ${{ always() && needs.metadata.result == 'success' && needs.quality.result == 'success' && needs.metadata.outputs.publish == 'true' && (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped') && (needs.build_linux.result == 'success' || needs.build_linux.result == 'skipped') && ((needs.metadata.outputs.build_macos == 'true' && needs.build_macos.result == 'success' && needs.ingest_macos.result == 'success') || (needs.metadata.outputs.build_macos != 'true' && needs.build_macos.result == 'skipped' && needs.ingest_macos.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-pro-publish-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout verified release source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify immutable tag, source, version, and notes
        run: |
          set -euo pipefail
          source_sha="${{ needs.metadata.outputs.source_sha }}"; release_tag="${{ needs.metadata.outputs.tag }}"
          version="${{ needs.metadata.outputs.version }}"; notes_path="${{ needs.metadata.outputs.notes_path }}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")" = "$source_sha"
          test "$release_tag" = "v${version}"
          test -s "$notes_path"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs"), expected = process.argv[1];
            for (const [pkgPath, lockPath] of [["pro-desktop/package.json", "pro-desktop/package-lock.json"], ["pro-shared-ui/package.json", "pro-shared-ui/package-lock.json"], ["logosforge-ui-contracts/package.json", "logosforge-ui-contracts/package-lock.json"]]) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
              if (pkg.version !== lock.version || pkg.version !== lock.packages?.[""]?.version) {
                console.error(`::error::Version drift between ${pkgPath} and ${lockPath}`); process.exit(1);
              }
              if (pkgPath === "pro-desktop/package.json" && pkg.version !== expected) {
                console.error(`::error::Pro desktop version drift in ${pkgPath}`); process.exit(1);
              }
            }
          ' "$version"

      - name: Download Windows artifact
        if: needs.metadata.outputs.build_windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: logosforge-pro-windows-x64
          path: release-assets/windows

      - name: Download Linux artifact
        if: needs.metadata.outputs.build_linux == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: logosforge-pro-linux-x64
          path: release-assets/linux

      - name: Download macOS artifact
        if: needs.metadata.outputs.build_macos == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: logosforge-pro-macos-intel-x64
          path: release-assets/macos

      - name: Download macOS provenance
        if: needs.metadata.outputs.build_macos == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: logosforge-pro-macos-intel-x64-provenance
          path: release-assets/macos-provenance

      - name: Re-verify downloaded macOS artifact and provenance
        if: needs.metadata.outputs.build_macos == 'true'
        env:
          EXPECTED_DMG_SHA256: ${{ needs.ingest_macos.outputs.dmg_sha256 }}
          HANDOFF_RUN_ATTEMPT: ${{ needs.build_macos.outputs.handoff_run_attempt }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          dmg="release-assets/macos/LogosForge Pro-${VERSION}-x64.dmg"
          provenance="release-assets/macos-provenance"
          set -- release-assets/macos/*.dmg
          if [ "$#" -ne 1 ] || [ "$1" != "$dmg" ] || [ ! -s "$dmg" ] || [ -L "$dmg" ]; then
            echo "::error::Downloaded macOS artifact contract mismatch."
            exit 1
          fi
          for name in macos-handoff.json pip-freeze.txt SHA256SUMS-and-build.txt; do
            test -s "$provenance/$name" && test ! -L "$provenance/$name" || {
              echo "::error::Downloaded macOS provenance is missing or unsafe: $name"
              exit 1
            }
          done
          provenance_entries="$(find "$provenance" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          expected_entries="$(printf '%s\n' SHA256SUMS-and-build.txt macos-handoff.json pip-freeze.txt | sort)"
          if [ "$provenance_entries" != "$expected_entries" ]; then
            echo "::error::Downloaded macOS provenance contains unexpected entries."
            exit 1
          fi
          verify_root="release-assets/macos-verify"
          if [ -e "$verify_root" ] || [ -L "$verify_root" ]; then rm -rf -- "$verify_root"; fi
          mkdir -m 700 -- "$verify_root"
          cp -- "$dmg" "$verify_root/"
          cp -- "$provenance/macos-handoff.json" "$provenance/pip-freeze.txt" "$provenance/SHA256SUMS-and-build.txt" "$verify_root/"
          source_tree_sha256="$(git ls-tree -r --full-tree "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          python3 pro-desktop/scripts/macos-handoff-evidence.py verify \
            --staging-dir "$verify_root" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha256 "$source_tree_sha256" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$HANDOFF_RUN_ATTEMPT" \
            --version "$VERSION" \
            --platform macos-intel-x64 \
            --dmg-name "LogosForge Pro-${VERSION}-x64.dmg"
          printf '%s\n' "$EXPECTED_DMG_SHA256" | grep -Eq '^[0-9a-f]{64}$' || {
            echo "::error::Hosted ingest did not return a valid DMG digest."
            exit 1
          }
          observed_dmg_sha256="$(sha256sum "$dmg" | awk '{print $1}')"
          if [ "$observed_dmg_sha256" != "$EXPECTED_DMG_SHA256" ]; then
            echo "::error::Downloaded DMG does not match the hosted ingest digest."
            exit 1
          fi

      - name: Stage exactly the selected successful artifacts
        env:
          BUILD_WINDOWS: ${{ needs.metadata.outputs.build_windows }}
          BUILD_LINUX: ${{ needs.metadata.outputs.build_linux }}
          BUILD_MACOS: ${{ needs.metadata.outputs.build_macos }}
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          mkdir -p release-assets/selected
          if [ "$BUILD_WINDOWS" = "true" ]; then
            installer="release-assets/windows/LogosForge Pro-${version}-x64.exe"
            portable="release-assets/windows/LogosForge Pro-${version}-x64-portable.exe"
            set -- release-assets/windows/*.exe
            if [ "$#" -ne 2 ] || [ ! -s "$installer" ] || [ ! -s "$portable" ]; then
              echo "::error::Windows artifact contract mismatch."
              exit 1
            fi
            cp -- "$installer" "$portable" release-assets/selected/
          fi
          if [ "$BUILD_LINUX" = "true" ]; then
            appimage="release-assets/linux/LogosForge Pro-${version}-x86_64.AppImage"
            set -- release-assets/linux/*.AppImage
            if [ "$#" -ne 1 ] || [ "$1" != "$appimage" ] || [ ! -s "$appimage" ]; then
              echo "::error::Linux artifact contract mismatch."
              exit 1
            fi
            cp -- "$appimage" release-assets/selected/
          fi
          if [ "$BUILD_MACOS" = "true" ]; then
            dmg="release-assets/macos/LogosForge Pro-${version}-x64.dmg"
            set -- release-assets/macos/*.dmg
            if [ "$#" -ne 1 ] || [ "$1" != "$dmg" ] || [ ! -s "$dmg" ]; then
              echo "::error::macOS artifact contract mismatch."
              exit 1
            fi
            cp -- "$dmg" release-assets/selected/
          fi
          count="$(find release-assets/selected -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 1 ]; then echo "::error::No verified native artifacts were staged."; exit 1; fi
          find release-assets/selected -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish GitHub prerelease once
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (Node 24)
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.source_sha }}
          name: LogosForge Pro ${{ needs.metadata.outputs.version }} (Alpha)
          body_path: ${{ needs.metadata.outputs.notes_path }}
          append_body: false
          generate_release_notes: false
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/selected/*
