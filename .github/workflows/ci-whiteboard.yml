name: CI — LogosForge Whiteboard

on:
  pull_request:
    paths:
      - "logosforge/**"
      - "whiteboard-desktop/**"
      - ".github/npm-audit-policy.mjs"
      - ".github/workflows/ci-whiteboard.yml"
      - ".github/workflows/release-whiteboard-*.yml"
  push:
    branches:
      - main
    paths:
      - "logosforge/**"
      - "whiteboard-desktop/**"
      - ".github/npm-audit-policy.mjs"
      - ".github/workflows/ci-whiteboard.yml"
      - ".github/workflows/release-whiteboard-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-whiteboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whiteboard-quality:
    name: Whiteboard quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            logosforge/pyproject.toml
            whiteboard-desktop/backend/requirements.txt

      - name: Install Whiteboard backend and core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./logosforge[export]" -r whiteboard-desktop/backend/requirements.txt pytest "pyinstaller==6.22.2"

      - name: Test Whiteboard backend
        run: |
          python -m pytest whiteboard-desktop/backend/tests -q
          python -m compileall -q \
            whiteboard-desktop/backend/app \
            whiteboard-desktop/backend/whiteboard-mcp-entry.py \
            whiteboard-desktop/backend/smoke-frozen-mcp.py \
            whiteboard-desktop/backend/smoke-packaged-mcp.py
          python -m pip check

      - name: Build and smoke-test frozen Whiteboard sidecars
        working-directory: whiteboard-desktop/backend
        run: |
          set -euo pipefail
          python -m PyInstaller logosforge-whiteboard-backend.spec --noconfirm --clean --log-level WARN
          python -m PyInstaller logosforge-whiteboard-mcp.spec --noconfirm --clean --log-level WARN
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          python smoke-frozen-mcp.py \
            "dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend${suffix}" \
            "dist/logosforge-whiteboard-mcp${suffix}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whiteboard-desktop/desktop/package-lock.json

      - name: Install Whiteboard renderer
        working-directory: whiteboard-desktop/desktop
        run: npm ci

      - name: Test and build Whiteboard renderer
        working-directory: whiteboard-desktop/desktop
        run: |
          npm test
          npm run build

      - name: Enforce the npm dependency audit policy
        working-directory: whiteboard-desktop/desktop
        # The policy audits production and development dependencies, including
        # Electron, while narrowly documenting unpatched build-tool advisories.
        run: node ../../.github/npm-audit-policy.mjs
