name: Release — LogosForge Whiteboard (macOS, Intel)

# Builds the macOS Intel (x64) DMG for LogosForge Whiteboard desktop on macOS 12+.
# Fully self-contained: the Electron shell + the renderer + a PyInstaller-frozen
# copy of the Whiteboard backend (which embeds the Python core) — no Python needed
# on the user's machine.
#
# Runs on a SELF-HOSTED Intel Mac (labels: self-hosted, macOS, X64). GitHub's
# hosted Intel runners would not allocate on this account (jobs sat
# `pending` forever), and you can't produce an x64 build on an arm64 runner
# (PyInstaller can't cross-compile the backend) — so the build runs on your own
# Intel Mac, which is also the test target. Set the runner up once via repo
# Settings -> Actions -> Runners -> New self-hosted runner (macOS / x64); it
# needs Xcode Command Line Tools + a Python 3.11+ (any of 3.11/3.12/3.13 works)
# installed via Homebrew or python.org + enough disk (~a few GB). setup-node
# downloads Node into the runner tool cache; Python is discovered on the Mac
# (setup-python can't download onto a self-hosted Mac — it assumes the hosted
# /Users/runner home and fails with "mkdir: /Users/runner: Permission denied").
#
# NOTE: builds are UNSIGNED (no Apple Developer ID configured). macOS Gatekeeper
# will block the app until it is signed + notarized — testers must clear the
# quarantine attribute: right-click → Open, or
#   xattr -cr "/Applications/LogosForge Whiteboard.app"
# Apple Silicon (arm64) / universal builds are a later milestone.
#
# Assumes a single monorepo checkout containing: logosforge/ (core) and
# whiteboard-desktop/. The whiteboard renderer is self-contained (no shared-ui
# file: deps), so only those two siblings are required.

on:
  push:
    tags:
      - "whiteboard-v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the build to the existing GitHub prerelease"
        type: boolean
        default: false
      release_tag:
        description: "Existing Whiteboard tag to build and publish"
        type: string
        required: false
        default: "whiteboard-v0.1.13"

permissions:
  contents: write

concurrency:
  group: release-whiteboard-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-intel:
    runs-on: [self-hosted, macOS, X64] # your Intel Mac (self-hosted runner)
    timeout-minutes: 45
    env:
      # GitHub's Node 24 action runtime requires macOS 13.5+. Keep the JS
      # actions on their declared Node 20 runtime for this Monterey release.
      # GitHub removes this temporary escape hatch on 2026-09-23.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify Intel macOS 12+ release host
        run: |
          set -euo pipefail

          host_arch="$(uname -m)"
          if [ "$host_arch" != "x86_64" ]; then
            echo "::error::Whiteboard's Intel release requires x86_64; runner reported $host_arch."
            exit 1
          fi
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')"
          if [ "$translated" = "1" ]; then
            echo "::error::Whiteboard's Intel release requires a native x86_64 host; this process is running under Rosetta."
            exit 1
          fi

          host_version="$(sw_vers -productVersion)"
          host_major="${host_version%%.*}"
          case "$host_major" in
            ""|*[!0-9]*)
              echo "::error::Could not parse the macOS version: $host_version"
              exit 1
              ;;
          esac
          if [ "$host_major" -lt 12 ]; then
            echo "::error::Whiteboard's Intel release requires macOS 12 or newer; runner reported $host_version."
            exit 1
          fi
          echo "release host OK: macOS $host_version ($host_arch)"

      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Resolve and verify Whiteboard release metadata
        id: release
        env:
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          publish=false
          release_tag=""

          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                echo "::error::Release push is not a tag."
                exit 1
              fi
              publish=true
              release_tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              if [ "${MANUAL_PUBLISH:-false}" = "true" ]; then
                publish=true
                release_tag="${MANUAL_TAG:-}"
              fi
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$publish" = "true" ]; then
            if [ -z "$release_tag" ]; then
              echo "::error::A release tag is required when publishing."
              exit 1
            fi
            case "$release_tag" in
              whiteboard-v*) ;;
              *)
                echo "::error::Release tag must start with whiteboard-v."
                exit 1
                ;;
            esac
            if ! git check-ref-format "refs/tags/$release_tag" >/dev/null; then
              echo "::error::Invalid release tag: $release_tag"
              exit 1
            fi
            tag_commit="$(git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}")" || {
              echo "::error::Release tag does not exist: $release_tag"
              exit 1
            }
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              git checkout --detach --quiet "$tag_commit"
            fi
            if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
              echo "::error::The checkout does not match $release_tag."
              exit 1
            fi
          fi

          version="$(
            node -e '
              const fs = require("node:fs");
              const pkg = JSON.parse(fs.readFileSync("whiteboard-desktop/desktop/package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync("whiteboard-desktop/desktop/package-lock.json", "utf8"));
              const versions = {
                packageJson: pkg.version,
                packageLock: lock.version,
                packageLockRoot: lock.packages?.[""]?.version,
              };
              const values = Object.values(versions);
              const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
              if (values.some((value) => typeof value !== "string") || new Set(values).size !== 1 || !semver.test(pkg.version)) {
                console.error("::error::Invalid or inconsistent Whiteboard versions: " + JSON.stringify(versions));
                process.exit(1);
              }
              process.stdout.write(pkg.version);
            '
          )"

          expected_tag="whiteboard-v${version}"
          notes_path="whiteboard-desktop/release-notes/${expected_tag}.md"

          if [ "$publish" = "true" ] && [ "$release_tag" != "$expected_tag" ]; then
            echo "::error::Tag $release_tag does not match package version $version; expected $expected_tag."
            exit 1
          fi
          if [ "$publish" = "true" ] && [ ! -s "$notes_path" ]; then
            echo "::error::Missing or empty release notes: $notes_path"
            exit 1
          fi
          if [ "$publish" != "true" ]; then
            release_tag="$expected_tag"
          fi

          {
            echo "publish=$publish"
            echo "version=$version"
            echo "tag=$release_tag"
            echo "notes_path=$notes_path"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify monorepo layout
        run: |
          missing=""
          for d in logosforge whiteboard-desktop; do
            [ -d "$d" ] || missing="$missing $d"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required sibling dir(s):$missing — this workflow expects a single monorepo checkout containing the core (logosforge/) and whiteboard-desktop/."
            exit 1
          fi
          echo "monorepo layout OK"

      # actions/setup-python@v5 does NOT work on a self-hosted macOS runner when
      # it has to download a version — it assumes the hosted `/Users/runner`
      # home and fails with "mkdir: /Users/runner: Permission denied". Use a
      # Python already installed on the Mac instead (3.11 preferred, else 3.12/13;
      # any is fine for the freeze). PATH is augmented because the runner service
      # runs with a minimal PATH that may omit Homebrew / python.org locations.
      - name: Locate Python (3.11+)
        id: py
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:/Library/Frameworks/Python.framework/Versions/3.11/bin:/Library/Frameworks/Python.framework/Versions/3.12/bin:/Library/Frameworks/Python.framework/Versions/3.13/bin:$PATH"
          for c in python3.11 python3.12 python3.13 python3; do
            p=$(command -v "$c" 2>/dev/null) || continue
            v=$("$p" -c 'import sys;print("%d.%d"%sys.version_info[:2])' 2>/dev/null) || continue
            case "$v" in
              3.11|3.12|3.13) echo "python=$p" >> "$GITHUB_OUTPUT"; echo "Using $p (Python $v)"; exit 0;;
            esac
          done
          echo "::error::No Python 3.11+ on the runner. Install one (e.g. 'brew install python@3.11') and re-run."
          exit 1

      # --- 1. Bundle the Whiteboard backend + read-only MCP companion, x64 -
      - name: Build the backend and MCP bundles (PyInstaller)
        run: |
          "${{ steps.py.outputs.python }}" -m venv build-venv
          ./build-venv/bin/python -m pip install --upgrade pip
          ./build-venv/bin/python -m pip install "./logosforge[export]" -r whiteboard-desktop/backend/requirements.txt pytest pyinstaller
          ./build-venv/bin/python -m pytest whiteboard-desktop/backend/tests -q
          ./build-venv/bin/python -m compileall -q \
            whiteboard-desktop/backend/app \
            whiteboard-desktop/backend/whiteboard-mcp-entry.py \
            whiteboard-desktop/backend/smoke-frozen-mcp.py \
            whiteboard-desktop/backend/smoke-packaged-mcp.py
          ./build-venv/bin/python -m pip check
          cd whiteboard-desktop/backend
          ../../build-venv/bin/python -m PyInstaller logosforge-whiteboard-backend.spec --noconfirm --clean --log-level WARN
          ../../build-venv/bin/python -m PyInstaller logosforge-whiteboard-mcp.spec --noconfirm --clean --log-level WARN

      - name: Smoke-test the bundled backend
        run: |
          set -euo pipefail

          python_cmd="./build-venv/bin/python"
          port="$("$python_cmd" -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          expected_core_version="$("$python_cmd" -c 'import logosforge; print(logosforge.__version__)')"
          instance_nonce="$("$python_cmd" -c 'import secrets; print(secrets.token_hex(16))')"
          backend_pid=""
          smoke_data_dir=""
          backend_log=""
          temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          temp_root="$(cd "$temp_root" && pwd -P)"
          case "$temp_root" in
            ""|"/")
              echo "::error::Unsafe runner temp directory: $temp_root"
              exit 1
              ;;
          esac

          cleanup() {
            local rc="${1:-$?}"
            trap - EXIT INT TERM
            if [ -n "$backend_pid" ]; then
              if kill -0 "$backend_pid" 2>/dev/null; then
                kill "$backend_pid" 2>/dev/null || true
                for ((stop_attempt = 1; stop_attempt <= 5; stop_attempt++)); do
                  kill -0 "$backend_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$backend_pid" 2>/dev/null; then
                  kill -KILL "$backend_pid" 2>/dev/null || true
                fi
              fi
              wait "$backend_pid" 2>/dev/null || true
            fi
            if [ "$rc" -ne 0 ] && [ -n "$backend_log" ] && [ -f "$backend_log" ]; then
              echo "::group::bundled backend log"
              cat -- "$backend_log" || true
              echo "::endgroup::"
            fi
            if [ -n "$smoke_data_dir" ]; then
              case "$smoke_data_dir" in
                "$temp_root"/logosforge-whiteboard-smoke.??????)
                  if ! rm -rf -- "$smoke_data_dir"; then
                    echo "::error::Failed to remove smoke data directory: $smoke_data_dir"
                    rc=1
                  fi
                  ;;
                *)
                  echo "::error::Refusing unsafe smoke data cleanup target: $smoke_data_dir"
                  rc=1
                  ;;
              esac
            fi
            if [ -n "$backend_log" ]; then
              rm -f -- "$backend_log" || true
            fi
            exit "$rc"
          }
          trap 'cleanup $?' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM

          smoke_data_dir="$(mktemp -d "$temp_root/logosforge-whiteboard-smoke.XXXXXX")"
          case "$smoke_data_dir" in
            "$temp_root"/logosforge-whiteboard-smoke.??????) ;;
            *)
              echo "::error::Unsafe smoke data directory returned by mktemp: $smoke_data_dir"
              exit 1
              ;;
          esac
          backend_log="${smoke_data_dir}.backend.log"

          LOGOSFORGE_WHITEBOARD_INSTANCE_NONCE="$instance_nonce" \
            LOGOSFORGE_DATA_DIR="$smoke_data_dir" \
            LOGOSFORGE_DB_PATH="$smoke_data_dir/logosforge-smoke.db" \
            ./whiteboard-desktop/backend/dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend --host 127.0.0.1 --port "$port" >"$backend_log" 2>&1 &
          backend_pid=$!

          ok=""
          for ((attempt = 1; attempt <= 30; attempt++)); do
            sleep 1
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            health_json="$(curl -fsS --max-time 2 "http://127.0.0.1:${port}/health" 2>/dev/null || true)"
            if printf '%s' "$health_json" | \
              EXPECTED_CORE_VERSION="$expected_core_version" \
              EXPECTED_INSTANCE_NONCE="$instance_nonce" \
              "$python_cmd" -c 'import json, os, sys; data = json.load(sys.stdin); expected = {"status": "ok", "service": "logosforge-whiteboard-backend", "core_version": os.environ["EXPECTED_CORE_VERSION"], "instance_nonce": os.environ["EXPECTED_INSTANCE_NONCE"]}; raise SystemExit(0 if all(data.get(key) == value for key, value in expected.items()) else 1)' 2>/dev/null
            then
              kill -0 "$backend_pid" 2>/dev/null || break
              ok="yes"
              echo "backend healthy after ${attempt}s (core $expected_core_version)"
              break
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::bundled backend failed verified /health on port $port (expected core $expected_core_version)"
            exit 1
          fi

      - name: Smoke-test the bundled MCP companion
        run: >-
          ./build-venv/bin/python whiteboard-desktop/backend/smoke-frozen-mcp.py
          whiteboard-desktop/backend/dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend
          whiteboard-desktop/backend/dist/logosforge-whiteboard-mcp

      # --- 2. Build + package the Electron app (DMG) -----------------------
      - name: Install whiteboard-desktop deps
        working-directory: whiteboard-desktop/desktop
        run: npm ci

      - name: Test renderer and audit runtime dependencies
        working-directory: whiteboard-desktop/desktop
        run: |
          npm test
          npm audit --audit-level=moderate

      - name: Build renderer + main, then package (DMG)
        working-directory: whiteboard-desktop/desktop
        run: npm run dist:mac
        env:
          # Unsigned (no Apple Developer ID configured). Skips code signing so the
          # build doesn't fail looking for a cert; the DMG is un-notarized.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged Monterey app
        working-directory: whiteboard-desktop/desktop
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          app="release/mac/LogosForge Whiteboard.app"
          executable="$app/Contents/MacOS/LogosForge Whiteboard"
          backend="$app/Contents/Resources/backend/logosforge-whiteboard-backend"
          mcp="$app/Contents/Resources/mcp/logosforge-whiteboard-mcp"
          dmg="release/LogosForge Whiteboard-${version}-x64.dmg"

          [ -d "$app" ] || { echo "::error::Packaged app is missing: $app"; exit 1; }
          [ -x "$executable" ] || { echo "::error::Packaged Electron executable is missing: $executable"; exit 1; }
          [ -x "$backend" ] || { echo "::error::Packaged backend is missing: $backend"; exit 1; }
          [ -x "$mcp" ] || { echo "::error::Packaged MCP companion is missing: $mcp"; exit 1; }
          [ -f "$dmg" ] || { echo "::error::Versioned DMG is missing: $dmg"; exit 1; }

          minimum_system_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          if [ "$minimum_system_version" != "12.0.0" ]; then
            echo "::error::Expected LSMinimumSystemVersion 12.0.0, found $minimum_system_version."
            exit 1
          fi

          file "$executable" | grep -q 'x86_64' || {
            echo "::error::Packaged Electron executable is not Intel x86_64."
            exit 1
          }
          file "$backend" | grep -q 'x86_64' || {
            echo "::error::Packaged backend is not Intel x86_64."
            exit 1
          }
          file "$mcp" | grep -Eq 'Mach-O 64-bit executable x86_64' || {
            echo "::error::Packaged MCP companion is not Intel x86_64."
            exit 1
          }

          packaged_electron_version="$(ELECTRON_RUN_AS_NODE=1 "$executable" -p 'process.versions.electron')"
          case "$packaged_electron_version" in
            43.*) ;;
            *)
              echo "::error::Expected packaged Electron 43.x, found $packaged_electron_version."
              exit 1
              ;;
          esac

          echo "packaged app OK: Electron $packaged_electron_version, macOS $minimum_system_version, Intel x64"
          shasum -a 256 "$dmg"

      - name: Exercise packaged Whiteboard MCP bridge
        run: >-
          ./build-venv/bin/python whiteboard-desktop/backend/smoke-packaged-mcp.py
          "whiteboard-desktop/desktop/release/LogosForge Whiteboard-${{ steps.release.outputs.version }}-x64.dmg"
          --timeout 120

      # --- 3. Publish ------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logosforge-whiteboard-macos-x64
          path: whiteboard-desktop/desktop/release/*.dmg
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: LogosForge Whiteboard ${{ steps.release.outputs.version }} (Alpha)
          body_path: ${{ steps.release.outputs.notes_path }}
          append_body: false
          generate_release_notes: false
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: whiteboard-desktop/desktop/release/*.dmg
