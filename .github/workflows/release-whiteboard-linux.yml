name: Release — LogosForge Whiteboard (Linux)

# Builds the Linux x64 AppImage for LogosForge Whiteboard desktop on the free
# GitHub-hosted ubuntu-latest runner. Fully self-contained: the Electron shell +
# renderer + a PyInstaller-frozen copy of the Whiteboard backend (which embeds the
# Python core) — no Python needed on the user's machine. An AppImage runs on any
# modern distro (Ubuntu included): `chmod +x` it and launch, no install or root.
#
# Triggers:
#   * push a tag  whiteboard-v*      -> builds AND publishes to that tag's Release
#   * manual "Run workflow"          -> builds; publishes when publish_release is
#                                       set, to the chosen release_tag (used to
#                                       attach Linux to an already-published release)
#
# Assumes a single monorepo checkout containing logosforge/ (core) and
# whiteboard-desktop/. The renderer is self-contained (no shared-ui file: deps),
# so only those two siblings are required. Unsigned build.

on:
  push:
    tags:
      - "whiteboard-v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the build to the existing GitHub prerelease"
        type: boolean
        default: false
      release_tag:
        description: "Existing Whiteboard tag to build and publish"
        type: string
        required: false
        default: "whiteboard-v0.1.13"

permissions:
  contents: write

concurrency:
  group: release-whiteboard-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and verify Whiteboard release metadata
        id: release
        env:
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          publish=false
          release_tag=""

          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                echo "::error::Release push is not a tag."
                exit 1
              fi
              publish=true
              release_tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              if [ "${MANUAL_PUBLISH:-false}" = "true" ]; then
                publish=true
                release_tag="${MANUAL_TAG:-}"
              fi
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$publish" = "true" ]; then
            if [ -z "$release_tag" ]; then
              echo "::error::A release tag is required when publishing."
              exit 1
            fi
            case "$release_tag" in
              whiteboard-v*) ;;
              *)
                echo "::error::Release tag must start with whiteboard-v."
                exit 1
                ;;
            esac
            if ! git check-ref-format "refs/tags/$release_tag" >/dev/null; then
              echo "::error::Invalid release tag: $release_tag"
              exit 1
            fi
            tag_commit="$(git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}")" || {
              echo "::error::Release tag does not exist: $release_tag"
              exit 1
            }
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              git checkout --detach --quiet "$tag_commit"
            fi
            if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
              echo "::error::The checkout does not match $release_tag."
              exit 1
            fi
          fi

          version="$(
            node -e '
              const fs = require("node:fs");
              const pkg = JSON.parse(fs.readFileSync("whiteboard-desktop/desktop/package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync("whiteboard-desktop/desktop/package-lock.json", "utf8"));
              const versions = {
                packageJson: pkg.version,
                packageLock: lock.version,
                packageLockRoot: lock.packages?.[""]?.version,
              };
              const values = Object.values(versions);
              const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
              if (values.some((value) => typeof value !== "string") || new Set(values).size !== 1 || !semver.test(pkg.version)) {
                console.error("::error::Invalid or inconsistent Whiteboard versions: " + JSON.stringify(versions));
                process.exit(1);
              }
              process.stdout.write(pkg.version);
            '
          )"

          expected_tag="whiteboard-v${version}"
          notes_path="whiteboard-desktop/release-notes/${expected_tag}.md"

          if [ "$publish" = "true" ] && [ "$release_tag" != "$expected_tag" ]; then
            echo "::error::Tag $release_tag does not match package version $version; expected $expected_tag."
            exit 1
          fi
          if [ "$publish" = "true" ] && [ ! -s "$notes_path" ]; then
            echo "::error::Missing or empty release notes: $notes_path"
            exit 1
          fi
          if [ "$publish" != "true" ]; then
            release_tag="$expected_tag"
          fi

          {
            echo "publish=$publish"
            echo "version=$version"
            echo "tag=$release_tag"
            echo "notes_path=$notes_path"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify monorepo layout
        run: |
          missing=""
          for d in logosforge whiteboard-desktop; do
            [ -d "$d" ] || missing="$missing $d"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required sibling dir(s):$missing — this workflow expects a single monorepo checkout containing the core (logosforge/) and whiteboard-desktop/."
            exit 1
          fi
          echo "monorepo layout OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaged-app smoke runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 \
            libfuse2 libgbm1 libgtk-3-0 libnss3 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libxss1 libxtst6 xauth xdg-utils xvfb

      # --- 1. Bundle the Whiteboard backend + read-only MCP companion, x64 -
      - name: Build the backend and MCP bundles (PyInstaller)
        run: |
          python -m venv build-venv
          ./build-venv/bin/python -m pip install --upgrade pip
          ./build-venv/bin/python -m pip install "./logosforge[export]" -r whiteboard-desktop/backend/requirements.txt pytest pyinstaller
          ./build-venv/bin/python -m pytest whiteboard-desktop/backend/tests -q
          ./build-venv/bin/python -m compileall -q \
            whiteboard-desktop/backend/app \
            whiteboard-desktop/backend/whiteboard-mcp-entry.py \
            whiteboard-desktop/backend/smoke-frozen-mcp.py \
            whiteboard-desktop/backend/smoke-packaged-mcp.py
          ./build-venv/bin/python -m pip check
          cd whiteboard-desktop/backend
          ../../build-venv/bin/python -m PyInstaller logosforge-whiteboard-backend.spec --noconfirm --clean --log-level WARN
          ../../build-venv/bin/python -m PyInstaller logosforge-whiteboard-mcp.spec --noconfirm --clean --log-level WARN

      - name: Smoke-test the bundled backend
        run: |
          set -euo pipefail

          python_cmd="./build-venv/bin/python"
          port="$("$python_cmd" -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          expected_core_version="$("$python_cmd" -c 'import logosforge; print(logosforge.__version__)')"
          instance_nonce="$("$python_cmd" -c 'import secrets; print(secrets.token_hex(16))')"
          backend_pid=""
          smoke_data_dir=""
          backend_log=""
          temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          temp_root="$(cd "$temp_root" && pwd -P)"
          case "$temp_root" in
            ""|"/")
              echo "::error::Unsafe runner temp directory: $temp_root"
              exit 1
              ;;
          esac

          cleanup() {
            local rc="${1:-$?}"
            trap - EXIT INT TERM
            if [ -n "$backend_pid" ]; then
              if kill -0 "$backend_pid" 2>/dev/null; then
                kill "$backend_pid" 2>/dev/null || true
                for ((stop_attempt = 1; stop_attempt <= 5; stop_attempt++)); do
                  kill -0 "$backend_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$backend_pid" 2>/dev/null; then
                  kill -KILL "$backend_pid" 2>/dev/null || true
                fi
              fi
              wait "$backend_pid" 2>/dev/null || true
            fi
            if [ "$rc" -ne 0 ] && [ -n "$backend_log" ] && [ -f "$backend_log" ]; then
              echo "::group::bundled backend log"
              cat -- "$backend_log" || true
              echo "::endgroup::"
            fi
            if [ -n "$smoke_data_dir" ]; then
              case "$smoke_data_dir" in
                "$temp_root"/logosforge-whiteboard-smoke.??????)
                  if ! rm -rf -- "$smoke_data_dir"; then
                    echo "::error::Failed to remove smoke data directory: $smoke_data_dir"
                    rc=1
                  fi
                  ;;
                *)
                  echo "::error::Refusing unsafe smoke data cleanup target: $smoke_data_dir"
                  rc=1
                  ;;
              esac
            fi
            if [ -n "$backend_log" ]; then
              rm -f -- "$backend_log" || true
            fi
            exit "$rc"
          }
          trap 'cleanup $?' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM

          smoke_data_dir="$(mktemp -d "$temp_root/logosforge-whiteboard-smoke.XXXXXX")"
          case "$smoke_data_dir" in
            "$temp_root"/logosforge-whiteboard-smoke.??????) ;;
            *)
              echo "::error::Unsafe smoke data directory returned by mktemp: $smoke_data_dir"
              exit 1
              ;;
          esac
          backend_log="${smoke_data_dir}.backend.log"

          LOGOSFORGE_WHITEBOARD_INSTANCE_NONCE="$instance_nonce" \
            LOGOSFORGE_DATA_DIR="$smoke_data_dir" \
            LOGOSFORGE_DB_PATH="$smoke_data_dir/logosforge-smoke.db" \
            ./whiteboard-desktop/backend/dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend --host 127.0.0.1 --port "$port" >"$backend_log" 2>&1 &
          backend_pid=$!

          ok=""
          for ((attempt = 1; attempt <= 30; attempt++)); do
            sleep 1
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            health_json="$(curl -fsS --max-time 2 "http://127.0.0.1:${port}/health" 2>/dev/null || true)"
            if printf '%s' "$health_json" | \
              EXPECTED_CORE_VERSION="$expected_core_version" \
              EXPECTED_INSTANCE_NONCE="$instance_nonce" \
              "$python_cmd" -c 'import json, os, sys; data = json.load(sys.stdin); expected = {"status": "ok", "service": "logosforge-whiteboard-backend", "core_version": os.environ["EXPECTED_CORE_VERSION"], "instance_nonce": os.environ["EXPECTED_INSTANCE_NONCE"]}; raise SystemExit(0 if all(data.get(key) == value for key, value in expected.items()) else 1)' 2>/dev/null
            then
              kill -0 "$backend_pid" 2>/dev/null || break
              ok="yes"
              echo "backend healthy after ${attempt}s (core $expected_core_version)"
              break
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::bundled backend failed verified /health on port $port (expected core $expected_core_version)"
            exit 1
          fi

      - name: Smoke-test the bundled MCP companion
        run: >-
          ./build-venv/bin/python whiteboard-desktop/backend/smoke-frozen-mcp.py
          whiteboard-desktop/backend/dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend
          whiteboard-desktop/backend/dist/logosforge-whiteboard-mcp

      # --- 2. Build + package the Electron app (AppImage) ------------------
      - name: Install whiteboard-desktop deps
        working-directory: whiteboard-desktop/desktop
        run: npm ci

      - name: Test renderer and audit runtime dependencies
        working-directory: whiteboard-desktop/desktop
        run: |
          npm test
          npm audit --audit-level=moderate

      - name: Build renderer + main, then package (AppImage)
        working-directory: whiteboard-desktop/desktop
        run: npm run dist:linux
        env:
          # No Linux signing. APPIMAGE_EXTRACT_AND_RUN lets appimagetool build
          # without FUSE, which the CI runner lacks.
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Verify packaged Whiteboard MCP resource and architecture
        working-directory: whiteboard-desktop/desktop
        run: |
          set -euo pipefail

          appimage="$PWD/release/LogosForge Whiteboard-${{ steps.release.outputs.version }}-x64.AppImage"
          [ -s "$appimage" ] || { echo "::error::Versioned AppImage is missing: $appimage"; exit 1; }
          file "$appimage" | grep -Eq 'ELF 64-bit.*x86-64' || {
            echo "::error::Packaged AppImage is not Linux x64."
            exit 1
          }

          extract_root="$(mktemp -d "$RUNNER_TEMP/logosforge-whiteboard-appimage.XXXXXX")"
          cleanup_extract() {
            case "$extract_root" in
              "$RUNNER_TEMP"/logosforge-whiteboard-appimage.??????) rm -rf -- "$extract_root" ;;
              *) echo "::error::Refusing unsafe AppImage cleanup: $extract_root"; return 1 ;;
            esac
          }
          trap cleanup_extract EXIT INT TERM
          (cd "$extract_root" && "$appimage" --appimage-extract >/dev/null)

          mcp="$extract_root/squashfs-root/resources/mcp/logosforge-whiteboard-mcp"
          [ -x "$mcp" ] || { echo "::error::Packaged MCP companion is missing: $mcp"; exit 1; }
          file "$mcp" | grep -Eq 'ELF 64-bit.*x86-64' || {
            echo "::error::Packaged MCP companion is not Linux x64."
            exit 1
          }
          echo "packaged Linux x64 Whiteboard MCP companion OK: $mcp"

      - name: Exercise packaged Whiteboard MCP bridge
        run: >-
          ./build-venv/bin/python whiteboard-desktop/backend/smoke-packaged-mcp.py
          "whiteboard-desktop/desktop/release/LogosForge Whiteboard-${{ steps.release.outputs.version }}-x64.AppImage"
          --timeout 120

      # --- 3. Publish ------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logosforge-whiteboard-linux-x64
          path: whiteboard-desktop/desktop/release/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: LogosForge Whiteboard ${{ steps.release.outputs.version }} (Alpha)
          body_path: ${{ steps.release.outputs.notes_path }}
          append_body: false
          generate_release_notes: false
          draft: false
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: whiteboard-desktop/desktop/release/*.AppImage
