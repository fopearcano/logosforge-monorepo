name: CI — Packaged Whiteboard to Pro (Windows)

on:
  pull_request:
    paths:
      - "logosforge/**"
      - "logosforge-ui-contracts/**"
      - "pro-shared-ui/**"
      - "pro-desktop/**"
      - "whiteboard-desktop/**"
      - ".github/workflows/ci-packaged-windows.yml"
      - ".github/workflows/release-whiteboard-windows.yml"
      - ".github/workflows/release-windows.yml"
  push:
    branches:
      - main
    paths:
      - "logosforge/**"
      - "logosforge-ui-contracts/**"
      - "pro-shared-ui/**"
      - "pro-desktop/**"
      - "whiteboard-desktop/**"
      - ".github/workflows/ci-packaged-windows.yml"
      - ".github/workflows/release-whiteboard-windows.yml"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-packaged-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-writer-journey:
    name: Packaged Whiteboard → Pro writer journey
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout monorepo without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify packaged-gate inputs
        run: |
          set -euo pipefail
          for path in \
            logosforge/pyproject.toml \
            logosforge-ui-contracts/package.json \
            pro-shared-ui/package.json \
            pro-desktop/package.json \
            pro-desktop/core/logosforge-core.spec \
            pro-desktop/core/logosforge-mcp.spec \
            pro-desktop/core/mcp_entry.py \
            pro-desktop/scripts/smoke-frozen-mcp.py \
            pro-desktop/scripts/smoke-packaged-mcp.py \
            whiteboard-desktop/backend/requirements.txt \
            whiteboard-desktop/backend/logosforge-whiteboard-backend.spec \
            whiteboard-desktop/backend/logosforge-whiteboard-mcp.spec \
            whiteboard-desktop/backend/whiteboard-mcp-entry.py \
            whiteboard-desktop/backend/smoke-frozen-mcp.py \
            whiteboard-desktop/backend/smoke-packaged-mcp.py \
            whiteboard-desktop/desktop/package.json \
            whiteboard-desktop/desktop/scripts/packaged-acceptance.mjs
          do
            test -e "$path" || { echo "::error::Missing required monorepo path: $path"; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            logosforge-ui-contracts/package-lock.json
            pro-shared-ui/package-lock.json
            whiteboard-desktop/desktop/package-lock.json
            pro-desktop/package-lock.json

      - name: Create the shared packaging venv
        run: |
          set -euo pipefail
          python -m venv acceptance-venv
          ./acceptance-venv/Scripts/python.exe -m pip install --upgrade pip
          ./acceptance-venv/Scripts/python.exe -m pip install \
            "./logosforge[export,mcp]" \
            -r whiteboard-desktop/backend/requirements.txt \
            pytest \
            "pyinstaller==6.22.2"

      - name: Test Python sources and installed dependencies
        run: |
          set -euo pipefail
          ./acceptance-venv/Scripts/python.exe -m pytest whiteboard-desktop/backend/tests -q -p no:cacheprovider
          ./acceptance-venv/Scripts/python.exe -m compileall -q \
            logosforge/logosforge \
            whiteboard-desktop/backend/app \
            whiteboard-desktop/backend/whiteboard-mcp-entry.py \
            whiteboard-desktop/backend/smoke-frozen-mcp.py \
            whiteboard-desktop/backend/smoke-packaged-mcp.py \
            pro-desktop/core \
            pro-desktop/scripts/smoke-frozen-mcp.py \
            pro-desktop/scripts/smoke-packaged-mcp.py
          ./acceptance-venv/Scripts/python.exe -m pip check

      - name: Test, build, and audit Whiteboard sources
        working-directory: whiteboard-desktop/desktop
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate

      - name: Test API contracts
        working-directory: logosforge-ui-contracts
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Test, build, and audit Pro shared UI sources
        working-directory: pro-shared-ui
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate

      - name: Test, build, and audit Pro sources
        working-directory: pro-desktop
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate

      - name: Build fresh Whiteboard backend and MCP sidecars
        working-directory: whiteboard-desktop/backend
        run: |
          set -euo pipefail
          ../../acceptance-venv/Scripts/python.exe -m PyInstaller \
            logosforge-whiteboard-backend.spec \
            --noconfirm \
            --clean \
            --log-level WARN
          ../../acceptance-venv/Scripts/python.exe -m PyInstaller \
            logosforge-whiteboard-mcp.spec \
            --noconfirm \
            --clean \
            --log-level WARN

      - name: Smoke-test frozen Whiteboard MCP companion
        run: >-
          ./acceptance-venv/Scripts/python.exe whiteboard-desktop/backend/smoke-frozen-mcp.py
          whiteboard-desktop/backend/dist/logosforge-whiteboard-backend/logosforge-whiteboard-backend.exe
          whiteboard-desktop/backend/dist/logosforge-whiteboard-mcp.exe

      - name: Build fresh Pro core and MCP sidecars
        working-directory: pro-desktop/core
        run: |
          set -euo pipefail
          ../../acceptance-venv/Scripts/python.exe -m PyInstaller \
            logosforge-core.spec \
            --noconfirm \
            --clean \
            --log-level WARN
          ../../acceptance-venv/Scripts/python.exe -m PyInstaller \
            logosforge-mcp.spec \
            --noconfirm \
            --clean \
            --log-level WARN

      - name: Smoke-test frozen Pro MCP companion
        run: >-
          ./acceptance-venv/Scripts/python.exe pro-desktop/scripts/smoke-frozen-mcp.py
          pro-desktop/core/dist/logosforge-core/logosforge-core.exe
          --mcp-executable pro-desktop/core/dist/logosforge-mcp.exe

      - name: Package unpacked Whiteboard app
        working-directory: whiteboard-desktop/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack

      - name: Verify packaged Whiteboard MCP resource and architecture
        run: |
          set -euo pipefail
          MCP_EXE="$PWD/whiteboard-desktop/desktop/release/win-unpacked/resources/mcp/logosforge-whiteboard-mcp.exe" \
            ./acceptance-venv/Scripts/python.exe - <<'PY'
          import os
          from pathlib import Path

          companion = Path(os.environ["MCP_EXE"])

          def pe_machine(path: Path):
              with path.open("rb") as handle:
                  dos = handle.read(64)
                  if len(dos) != 64 or dos[:2] != b"MZ":
                      return None
                  handle.seek(int.from_bytes(dos[60:64], "little"))
                  return handle.read(4), int.from_bytes(handle.read(2), "little")

          if not companion.is_file():
              raise SystemExit(f"::error::Packaged Whiteboard MCP companion is missing: {companion}")
          if pe_machine(companion) != (b"PE\0\0", 0x8664):
              raise SystemExit("::error::Packaged Whiteboard MCP companion is not Windows x64.")
          print(f"packaged Windows x64 Whiteboard MCP companion OK: {companion}")
          PY

      - name: Exercise packaged Whiteboard MCP bridge
        run: >-
          ./acceptance-venv/Scripts/python.exe whiteboard-desktop/backend/smoke-packaged-mcp.py
          "whiteboard-desktop/desktop/release/win-unpacked/LogosForge Whiteboard.exe"

      - name: Package unpacked Pro app
        working-directory: pro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack

      - name: Verify packaged Pro MCP resource and architecture
        run: |
          set -euo pipefail
          MCP_EXE="$PWD/pro-desktop/release/win-unpacked/resources/mcp/logosforge-mcp.exe" \
            ./acceptance-venv/Scripts/python.exe - <<'PY'
          import os
          from pathlib import Path

          companion = Path(os.environ["MCP_EXE"])

          def pe_machine(path: Path):
              with path.open("rb") as handle:
                  dos = handle.read(64)
                  if len(dos) != 64 or dos[:2] != b"MZ":
                      return None
                  handle.seek(int.from_bytes(dos[60:64], "little"))
                  return handle.read(4), int.from_bytes(handle.read(2), "little")

          if not companion.is_file():
              raise SystemExit(f"::error::Packaged Pro MCP companion is missing: {companion}")
          if pe_machine(companion) != (b"PE\0\0", 0x8664):
              raise SystemExit("::error::Packaged Pro MCP companion is not Windows x64.")
          print(f"packaged Windows x64 Pro MCP companion OK: {companion}")
          PY

      - name: Exercise packaged Pro MCP companion
        run: >-
          ./acceptance-venv/Scripts/python.exe pro-desktop/scripts/smoke-packaged-mcp.py
          "pro-desktop/release/win-unpacked/LogosForge Pro.exe"

      - name: Run genuine packaged cross-product acceptance
        working-directory: whiteboard-desktop/desktop
        env:
          LOGOSFORGE_PACKAGED_ACCEPTANCE_ROOT: ${{ runner.temp }}/logosforge-packaged-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:packaged

      - name: Upload packaged-acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logosforge-packaged-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
